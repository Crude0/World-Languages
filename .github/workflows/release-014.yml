name: v0.1.4 sürümü (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Yayımla
        run: |
          cat > notes.md <<'EOF'
          **Nine colours in the legend.** The grey "other families" pile went from
          47 languages down to 11: Turkic and East/South Asian languages now have
          colours of their own. The palette is not hand-picked — the eight hues are
          searched in OKLCH space and verified against a colour-vision-deficiency
          simulation (Machado 2009) so that every pair, not just neighbours, stays
          apart. Creole languages are drawn in the colour of their lexifier with a
          diagonal hatch instead of getting a ninth hue.

          **Labels sit on the country now.** Name anchors are computed as the pole
          of inaccessibility rather than a centroid — a vertex mean put Norway's
          label in the sea and Croatia's on top of Bosnia. 228 of 234 anchors are
          strictly inside their country. Label and dot sizes are pinned to CSS
          pixels, which is why text was 3 px tall on a phone.

          **Smoothness.** Rewriting the `viewBox` every frame re-rasterised 550
          paths. During a gesture the already-rasterised layer is now moved and
          scaled with a CSS transform and the real `viewBox` is written once, when
          your finger lifts. The mobile sheet and layers menu are opaque surfaces
          instead of glass — no more opacity jump when the map moves, and the most
          expensive per-frame work is gone.

          **Pinch fixed.** Touching with two fingers made the map jump once before
          zooming, because the viewport was being centred on the initial midpoint.
          The point under your fingers now stays put, and two-finger panning works.
          The same bug existed on the desktop and is fixed there too.

          **Zoom 22× → 160×**, plus a 22-pixel invisible touch target on small
          countries — Singapore, Malta and Bahrain are selectable on the first try.

          **Light theme is fully light on Android.** The page declared
          `color-scheme: light`, so WebView applied its own algorithmic darkening
          and left the sheet and map surround dark. It now declares `light dark`.

          **Desktop masthead.** The statistics row emitted `<dt>/<dd>` while the CSS
          expected a different structure, so numbers and labels drifted apart. The
          heading is also top-aligned with the right-hand column now.

          **The repository is bilingual.** The default README is English, Turkish
          lives in `README.tr.md`, and the data document likewise.

          ### Downloads

          | Platform | File | Size |
          |---|---|---|
          | Android 7+ | `Dunya-Dilleri-Atlasi.apk` | 433 KB |
          | macOS 10.15+ | `Dunya-Dilleri-Atlasi.dmg` | 6.8 MB |
          | Windows 10+ | `Dunya Dilleri Atlasi.exe` | 4.1 MB |

          The apps are unsigned: on macOS right-click → **Open**, on Windows pick
          **More info** → **Run anyway**, on Android allow unknown sources.
          EOF
          gh release view v0.1.4 --repo "$REPO" >/dev/null 2>&1 && { echo "zaten var"; exit 0; }
          gh release create v0.1.4 --repo "$REPO" \
            --target "${{ github.sha }}" --latest \
            --title "v0.1.4 — Colours, labels and smooth gestures" \
            --notes-file notes.md \
            "dist/Dunya-Dilleri-Atlasi.apk" \
            "dist/Dunya-Dilleri-Atlasi.dmg" \
            "dist/Dunya Dilleri Atlasi.exe"
          gh release list --repo "$REPO"
