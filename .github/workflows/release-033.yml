name: v0.3.3 (tek seferlik)
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > notes.md <<'EOF'
          **The mouse wheel zoomed nothing — it scrolled the map.** Wheel events
          arrive with `deltaMode === 0`, and that branch went straight to panning;
          zooming only ran in line mode (Firefox on Windows). The handler now
          decides once per gesture: sparse, large, integer deltas with no horizontal
          component means a mouse wheel (zoom), anything else means a trackpad
          (pan). The decision is held for the rest of the gesture so the large
          deltas of the momentum phase cannot flip the mode mid-way. Pinch
          (ctrl + wheel) is unchanged.

          **Paths outside the viewport are no longer drawn.** Bounding boxes are
          computed once, and each frame only a box intersection is tested. Measured:
          at 4× zoom **582 of 616 paths** (94%) are skipped, at 17× nearly all of
          them. This does not change the frame rate on a desktop — it is already at
          the 60 fps cap — the gain is on devices limited by fill rate.

          **The published page was missing its `<head>`.** `docs/index.html` was the
          raw template output: no `<!doctype>`, no `<meta charset>`, no `lang`, no
          viewport meta. GitHub Pages sends the charset in the HTTP header so the
          problem stayed hidden, but served from a server that does not, the Turkish
          characters broke and the page threw; and on a phone browser it did not
          scale, having no viewport meta. All three outputs are now the same
          complete document.

          ### Downloads

          | Platform | File | Size |
          |---|---|---|
          | Android 7+ | `Dunya-Dilleri-Atlasi.apk` | 457 KB |
          | macOS 10.15+ | `Dunya-Dilleri-Atlasi.dmg` | 7.0 MB |
          | Windows 10+ | `Dunya Dilleri Atlasi.exe` | 4.2 MB |

          The apps are unsigned: on macOS right-click → **Open**, on Windows pick
          **More info** → **Run anyway**, on Android allow unknown sources.
          EOF
          gh release view v0.3.3 --repo "$REPO" >/dev/null 2>&1 && { echo "zaten var"; exit 0; }
          gh release create v0.3.3 --repo "$REPO" --target "${{ github.sha }}" --latest \
            --title "v0.3.3 — Wheel zoom, viewport culling" --notes-file notes.md \
            "dist/Dunya-Dilleri-Atlasi.apk" "dist/Dunya-Dilleri-Atlasi.dmg" "dist/Dunya Dilleri Atlasi.exe"
