name: v0.3.0 (tek seferlik)
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > notes.md <<'EOF'
          **The colours are vivid now.**

          The palette search capped chroma at 0.20 — that was my own "editorial
          look" preference, not something the separation criterion required. If
          anything, saturation *helps* separation. Two things changed:

          - The search is now **two-stage**: first clear the separation threshold,
            then maximise saturation among the palettes that do. Maximising the
            worst pair alone left colours that had already cleared the bar
            needlessly dull. Mean chroma went from 0.15 to 0.20.
          - The **lightness band** was widened. The real bottleneck was not chroma
            but lightness: below L 0.665 the sRGB gamut has no vivid orange or
            green — it has brown and olive. The dark band is now 0.56–0.76.

          The result measures better as well: in dark mode the worst pair went from
          ΔE 8.2 to **9.0** under colour-vision-deficiency simulation and from 15.3
          to **17.4** under normal vision, and contrast against the surface now
          passes without a warning. Light mode is 9.1 / 17.3, both above threshold.

          > Note: the dark lightness band now goes above the 0.48–0.67 range the
          > dataviz guidance recommends for thin marks. That is a deliberate
          > deviation — these are large filled areas on a near-black ocean, not thin
          > lines, and within the narrow band eight vivid colours could not clear
          > the separation threshold at all (0.915). The safety checks — CVD
          > separation, the normal-vision floor and contrast — all pass.

          ### Downloads

          | Platform | File | Size |
          |---|---|---|
          | Android 7+ | `Dunya-Dilleri-Atlasi.apk` | 433 KB |
          | macOS 10.15+ | `Dunya-Dilleri-Atlasi.dmg` | 6.8 MB |
          | Windows 10+ | `Dunya Dilleri Atlasi.exe` | 4.1 MB |

          The apps are unsigned: on macOS right-click → **Open**, on Windows pick
          **More info** → **Run anyway**, on Android allow unknown sources.
          EOF
          gh release view v0.3.0 --repo "$REPO" >/dev/null 2>&1 && { echo "zaten var"; exit 0; }
          gh release create v0.3.0 --repo "$REPO" --target "${{ github.sha }}" --latest \
            --title "v0.3.0 — Vivid palette" --notes-file notes.md \
            "dist/Dunya-Dilleri-Atlasi.apk" "dist/Dunya-Dilleri-Atlasi.dmg" "dist/Dunya Dilleri Atlasi.exe"
