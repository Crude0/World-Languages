name: v0.3.2 (tek seferlik)
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > notes.md <<'EOF'
          **Fixes the huge outline that appeared when you tapped a country or
          region.** Two mistakes of mine in 0.3.1:

          - Moving province borders onto their own layer, I replaced the `.sub` rule
            with `stroke: none` and **dropped `vector-effect: non-scaling-stroke`
            with it**. Without that property the selection outline's width is
            measured in map units instead of CSS pixels, so zooming in turned a
            2-unit line into tens of pixels and the selected region became a white
            blob. The property is back; measured, the outline is now 2 px at every
            zoom level.
          - I had also thickened the selection outline without being asked (2 → 2.6
            on mobile, 1.6 → 2.4 on desktop, 1.2 → 1.8 on hover). All reverted.

          The border hierarchy itself is unchanged: a country border is a solid dark
          line, a province border a white core over that dark casing.

          ### Downloads

          | Platform | File | Size |
          |---|---|---|
          | Android 7+ | `Dunya-Dilleri-Atlasi.apk` | 457 KB |
          | macOS 10.15+ | `Dunya-Dilleri-Atlasi.dmg` | 7.0 MB |
          | Windows 10+ | `Dunya Dilleri Atlasi.exe` | 4.2 MB |

          The apps are unsigned: on macOS right-click → **Open**, on Windows pick
          **More info** → **Run anyway**, on Android allow unknown sources.
          EOF
          gh release view v0.3.2 --repo "$REPO" >/dev/null 2>&1 && { echo "zaten var"; exit 0; }
          gh release create v0.3.2 --repo "$REPO" --target "${{ github.sha }}" --latest \
            --title "v0.3.2 — Selection outline fix" --notes-file notes.md \
            "dist/Dunya-Dilleri-Atlasi.apk" "dist/Dunya-Dilleri-Atlasi.dmg" "dist/Dunya Dilleri Atlasi.exe"
