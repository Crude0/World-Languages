name: retitle

# Tek seferlik: iş akışına geçerken --title sabit "v$V" yazıldığı için
# 0.4.0'dan beri Release listesi yalnız numaralardan oluşuyordu. Bu iş
# eskilerin başlığını "v0.3.0 — Vivid palette" üslubuna geri döndürür.
# Çalıştırıldıktan sonra bu dosya depodan silinir; release.yml artık
# başlığı notların ilk satırından okuyor, yani tekrar gerekmeyecek.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retitle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rename() {
            cur=$(gh release view "$1" --json name --jq .name 2>/dev/null || echo "")
            if [ -z "$cur" ]; then echo "$1: yok, atlandı"; return; fi
            if [ "$cur" != "$1" ]; then echo "$1: zaten '$cur', dokunulmadı"; return; fi
            gh release edit "$1" --title "$1 — $2"
            echo "$1 -> $1 — $2"
          }
          rename v0.4.0 "The panning stutter, found and measured"
          rename v0.5.0 "Every view has a link"
          rename v0.5.1 "A proper install window"
          rename v0.5.2 "DMG background, second attempt"
          rename v0.5.3 "DMG built on a real Mac"
          rename v0.6.0 "Script and official-language layers"
          rename v0.6.1 "Country card whitespace"
          rename v0.7.0 "Region data, 12 countries to 18"
          rename v0.8.0 "0.94 billion speakers, comparison and export"
          rename v0.9.0 "Controls on the map, full screen, new I-speak scale"
          rename v0.9.1 "Full screen closes the table first"
          rename v0.9.2 "Updates arrive on the first reload"
