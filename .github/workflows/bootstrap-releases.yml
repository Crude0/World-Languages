name: Sürümleri yayımla (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v0.1.2 sürümü
        run: |
          cat > notes-0.1.2.md <<'EOF'
          İlk yayımlanan sürüm.

          - 234 ülke ve bağımlı bölge, 142 dil, 1.100'den fazla ülke × dil satırı.
          - Dile göre süzme: çoğunluk olduğu ülkeler koyu, azınlık olarak konuşulduğu
            ülkeler soluk. Türkçe 26 ülkede görünüyor.
          - Konuşan sayıları; ana dil ve ikinci dil ayrı ayrı.
          - Yoğunluk (ısı haritası) modu: nüfustaki paya veya kişi sayısına göre renk.
          - 12 ülkede eyalet / il / kanton düzeyi — 313 bölge. Uzaktayken ülke,
            yaklaşınca bölge sınırları, ya da elle sabitlenebilir.
          - Masaüstü uygulamaları işletim sisteminin tarayıcı motoruyla kendi
            penceresinde açılır: macOS'ta WKWebView, Windows'ta WebView2.
          - Telefon için ayrı yazılmış arayüz: tam ekran harita, cam katmanlar,
            üç duraklı alt panel, dokunmatik jestler.
          - Tamamen çevrimdışı; ağ isteği ve izin yok.
          EOF
          if gh release view v0.1.2 --repo "$REPO" >/dev/null 2>&1; then
            echo "v0.1.2 zaten var, atlanıyor"
          else
            gh release create v0.1.2 --repo "$REPO" \
              --target 9e115696684253831698b4ee8fed6d2f4a885329 \
              --title "v0.1.2 — İlk sürüm" \
              --notes-file notes-0.1.2.md
          fi

      - name: v0.1.3 sürümü
        run: |
          cat > notes-0.1.3.md <<'EOF'
          **İngilizce arayüz.** Başlıktaki (mobilde görünüm menüsündeki) düğmeyle
          Türkçe ve İngilizce arasında geçiş yapılır. Yalnızca menüler değil;
          142 dilin adı, 44 dil ailesi etiketi, dağılım satırlarındaki 352 dil adı,
          137 ülke notu, kıta adları ve sayı biçimi de çevrilir
          (1,2 milyar ↔ 1.2 billion). Seçim tarayıcıda saklanır, ilk açılışta
          sistem diline bakılır.

          **Tema seçici.** Otomatik (sistemi izler) davranışın üstüne elle **Açık**
          ve **Koyu** seçenekleri eklendi. Üç durum da kalıcı.

          **Mobil panel iyileştirmeleri.** Alttan çekilen panelin tutamağı
          büyütüldü: dokunma alanı 44 px yüksekliğe çıktı, çizgi 44×6 px oldu ve
          sürüklerken 52 px'e genişleyip soluklaşıyor. Panel içeriği kaydırıldığında
          başlığın altında ince bir ayraç beliriyor.

          ### İndir

          | Platform | Dosya | Boyut |
          |---|---|---|
          | Android 7+ | `Dunya-Dilleri-Atlasi.apk` | 433 KB |
          | macOS 10.15+ | `Dunya-Dilleri-Atlasi.dmg` | 6,8 MB |
          | Windows 10+ | `Dunya Dilleri Atlasi.exe` | 4,1 MB |

          Uygulamalar imzalı değil: macOS'ta ilk açılışta sağ tık → **Aç**,
          Windows'ta SmartScreen uyarısında **Ek bilgi** → **Yine de çalıştır**,
          Android'de bilinmeyen kaynaklara izin vermek gerekir.
          EOF
          if gh release view v0.1.3 --repo "$REPO" >/dev/null 2>&1; then
            echo "v0.1.3 zaten var, atlanıyor"
          else
            gh release create v0.1.3 --repo "$REPO" \
              --target f9deda22cc24eaca64ae1e15942979922c74b350 \
              --latest \
              --title "v0.1.3 — İngilizce arayüz ve tema seçici" \
              --notes-file notes-0.1.3.md \
              "dist/Dunya-Dilleri-Atlasi.apk" \
              "dist/Dunya-Dilleri-Atlasi.dmg" \
              "dist/Dunya Dilleri Atlasi.exe"
          fi

      - name: Artık gerekmeyen dalı sil
        continue-on-error: true
        run: |
          gh api -X DELETE "repos/$REPO/git/refs/heads/tmp-probe" && echo "tmp-probe silindi"

      - name: GitHub Pages'i aç (main /docs)
        continue-on-error: true
        run: |
          gh api -X POST "repos/$REPO/pages" \
            -f "source[branch]=main" -f "source[path]=/docs" \
            && echo "Pages açıldı" \
            || gh api -X PUT "repos/$REPO/pages" \
                 -f "source[branch]=main" -f "source[path]=/docs" \
               && echo "Pages ayarı güncellendi"

      - name: Sonuç
        run: gh release list --repo "$REPO"
