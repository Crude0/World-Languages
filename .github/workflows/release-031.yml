name: v0.3.1 (tek seferlik)
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > notes.md <<'EOF'
          **Borders are legible now, and country borders no longer look like
          province borders.**

          The province line was a 34%-opacity white hairline that vanished on the
          brighter fills. Worse, a national border and an internal one were
          indistinguishable — Belgium looked as though its north belonged to the
          Netherlands and its south to France.

          The cause was a layering mistake. What was drawn as "the country outline"
          was the outline of all the province paths concatenated — so it traced
          **every province border**, not the country's, and since the provinces were
          painted on top of it, the US–Canada border ended up looking exactly like a
          state line. It is also why coastlines had a white rim.

          `build_subs.py` now separates the two properly: an edge shared by two
          provinces is internal, an edge used once is the country's outer boundary.
          The points are already snapped to a grid, so the edges match exactly. The
          result:

          - **country border** — a solid dark line,
          - **province border** — a white core over that same dark casing,
          - **coastline** — clean, no rim.

          The meaning is the same in both themes: a dark line is always a country.
          Also fixed: on the desktop, picking Dark by hand left `--sub-line`
          undefined, so province lines used the light theme's dark value.

          ### Downloads

          | Platform | File | Size |
          |---|---|---|
          | Android 7+ | `Dunya-Dilleri-Atlasi.apk` | 457 KB |
          | macOS 10.15+ | `Dunya-Dilleri-Atlasi.dmg` | 7.0 MB |
          | Windows 10+ | `Dunya Dilleri Atlasi.exe` | 4.2 MB |

          The apps are unsigned: on macOS right-click → **Open**, on Windows pick
          **More info** → **Run anyway**, on Android allow unknown sources.
          EOF
          gh release view v0.3.1 --repo "$REPO" >/dev/null 2>&1 && { echo "zaten var"; exit 0; }
          gh release create v0.3.1 --repo "$REPO" --target "${{ github.sha }}" --latest \
            --title "v0.3.1 — Legible borders" --notes-file notes.md \
            "dist/Dunya-Dilleri-Atlasi.apk" "dist/Dunya-Dilleri-Atlasi.dmg" "dist/Dunya Dilleri Atlasi.exe"
