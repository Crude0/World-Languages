name: v0.2.0 sürümü (tek seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: v0.1.4'ü kaldır (aynı içerik v0.2.0 olarak yayımlanacak)
        continue-on-error: true
        run: |
          gh release delete v0.1.4 --repo "$REPO" --yes --cleanup-tag && echo "v0.1.4 kaldırıldı"

      - name: v0.2.0'ı yayımla
        run: |
          cat > notes.md <<'EOF'
          A larger update than the numbering so far suggested: the palette, the
          label placement, the gesture engine and the theme behaviour all changed,
          so this is `0.2.0` rather than another patch.

          **Nine colours in the legend.** The grey "other families" pile went from
          47 languages down to 11: Turkic and East/South Asian languages now have
          colours of their own. The palette is not hand-picked — the eight hues are
          searched in OKLCH space and verified against a colour-vision-deficiency
          simulation (Machado 2009) so that every pair, not just neighbours, stays
          apart (worst pair ΔE 11.2 light / 8.2 dark). Creole languages are drawn in
          the colour of their lexifier with a diagonal hatch instead of getting a
          ninth hue — so Haitian Creole is hatched Romance red and Nigerian Pidgin
          hatched Germanic blue, and the colour says where the language came from.

          **Labels sit on the country now.** Name anchors are computed as the pole
          of inaccessibility rather than a vertex mean, which put Norway's label in
          the sea and Croatia's on top of Bosnia. 228 of 234 anchors are strictly
          inside their country. Label and dot sizes are pinned to CSS pixels — that
          is why text came out 3 px tall on a phone.

          **Smoothness.** Rewriting the `viewBox` every frame re-rasterised 550
          paths, which is why region mode stuttered worse than country mode. During
          a gesture the already-rasterised layer is now moved and scaled with a CSS
          transform, and the real `viewBox` is written once, when your finger lifts.
          The mobile sheet and layers menu became opaque surfaces instead of glass:
          no more opacity jump when the map moves, and the most expensive per-frame
          work is gone.

          **Pinch fixed.** Two fingers made the map jump once before zooming,
          because the viewport was being centred on the initial midpoint. The point
          under your fingers now stays put and two-finger panning works. The same
          bug existed on the desktop and is fixed there too.

          **Zoom 22× → 160×**, plus a 22-pixel invisible touch target on small
          countries — Singapore, Malta and Bahrain are selectable on the first try.
          A selected place no longer ends up hidden under the top bar.

          **Light theme is fully light on Android.** The page declared
          `color-scheme: light`, so WebView applied its own algorithmic darkening
          and left the sheet and the map surround dark. It now declares `light dark`.

          **Desktop masthead.** The statistics row emitted `<dt>/<dd>` while the CSS
          expected another structure, so numbers and labels drifted apart. The
          heading is top-aligned with the right-hand column now.

          **The repository is bilingual** — the default README is English, Turkish
          lives in `README.tr.md` — and `.app`, `.exe` and the APK finally carry the
          same version number as the tag, fed from a single `VERSION` file.

          ### Downloads

          | Platform | File | Size |
          |---|---|---|
          | Android 7+ | `Dunya-Dilleri-Atlasi.apk` | 433 KB |
          | macOS 10.15+ | `Dunya-Dilleri-Atlasi.dmg` | 6.8 MB |
          | Windows 10+ | `Dunya Dilleri Atlasi.exe` | 4.1 MB |

          The apps are unsigned: on macOS right-click → **Open**, on Windows pick
          **More info** → **Run anyway**, on Android allow unknown sources.
          EOF
          gh release view v0.2.0 --repo "$REPO" >/dev/null 2>&1 && { echo "zaten var"; exit 0; }
          gh release create v0.2.0 --repo "$REPO" \
            --target "${{ github.sha }}" --latest \
            --title "v0.2.0 — Colours, labels and smooth gestures" \
            --notes-file notes.md \
            "dist/Dunya-Dilleri-Atlasi.apk" \
            "dist/Dunya-Dilleri-Atlasi.dmg" \
            "dist/Dunya Dilleri Atlasi.exe"
          gh release list --repo "$REPO"
