<style>
/* ============================================================ temel ===== */
:root {
  /* İki temayı da desteklediğimizi bildirmezsek Android WebView sayfayı kendi
     algoritmasıyla karartıyor ve açık temada bazı yüzeyler koyu kalıyor. */
  color-scheme: light dark;
  --bg:        #eef1f4;
  --ocean:     #e3e8ec;
  --land-mute: #ccd1d7;
  --ink:       #171a20;
  --ink-2:     #454c57;
  --ink-3:     #6b7480;
  --rule:      rgba(23,26,32,.10);
  --sheet:     #ffffff;
  --glass:     rgba(252,253,254,.62);
  --glass-2:   rgba(252,253,254,.82);
  --edge:      rgba(255,255,255,.55);
  --shade:     rgba(16,20,28,.16);
  --tint:      #1f6feb;
  --hatch:     rgba(23,26,32,.34);
  /* Sınır hiyerarşisi: ülke sınırı koyu ve kalın, il/eyalet sınırı beyaz ve
     ince. İki tema arasında anlam sabit — koyu çizgi her zaman ülke. */
  --border:   rgba(10,12,16,.62);
  --sub-line: rgba(255,255,255,.70);
  --g-rom: #ea231a; --g-ger: #0080ea; --g-ine: #7529ce; --g-trk: #d88c04;
  --g-afa: #06830f; --g-nkg: #15bb77; --g-asi: #a40062; --g-aus: #db3bb6;
  --g-oth: #8d949e;
  --t-rom-0: #ff7c6b; --t-rom-1: #f54435; --t-rom-2: #d60000; --t-rom-3: #a40000;
  --t-ger-0: #65adff; --t-ger-1: #2e8ff3; --t-ger-2: #0071d1; --t-ger-3: #0055a0;
  --t-ine-0: #9963ef; --t-ine-1: #8041d7; --t-ine-2: #670dbd; --t-ine-3: #480089;
  --t-trk-0: #ffba61; --t-trk-1: #e49c36; --t-trk-2: #c47e00; --t-trk-3: #9d6400;
  --t-afa-0: #53ab50; --t-afa-1: #2d902c; --t-afa-2: #007205; --t-afa-3: #005201;
  --t-nkg-0: #6ee4a6; --t-nkg-1: #42c887; --t-nkg-2: #00aa6a; --t-nkg-3: #008753;
  --t-asi-0: #cb4d89; --t-asi-1: #b0286e; --t-asi-2: #8d0053; --t-asi-3: #610037;
  --t-aus-0: #ff7bdb; --t-aus-1: #e753c2; --t-aus-2: #c926a6; --t-aus-3: #a20084;
  --t-oth-0: #b7bec7; --t-oth-1: #9ba2ab; --t-oth-2: #7e858f; --t-oth-3: #616871;
  --tabh: 50px;              /* sekme çubuğu; açılışta ölçülüp yazılıyor */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0d1014;
    --ocean:     #12151b;
    --land-mute: #272b33;
    --ink:       #eceef2;
    --ink-2:     #b3bac4;
    --ink-3:     #838d99;
    --rule:      rgba(236,238,242,.12);
    --sheet:     #191d24;
    --glass:     rgba(28,32,40,.62);
    --glass-2:   rgba(28,32,40,.84);
    --edge:      rgba(255,255,255,.10);
    --shade:     rgba(0,0,0,.45);
    --tint:      #62a8ff;
    --hatch:     rgba(236,238,242,.30);
    --border:   rgba(0,0,0,.66);
    --sub-line: rgba(255,255,255,.58);
    --g-rom: #db0002; --g-ger: #119efd; --g-ine: #6354f5; --g-trk: #c7810a;
    --g-afa: #81c90d; --g-nkg: #009a73; --g-asi: #ff4b9d; --g-aus: #b529b8;
    --g-oth: #99a1ac;
    --t-rom-0: #ff6150; --t-rom-1: #e63328; --t-rom-2: #c20000; --t-rom-3: #900000;
    --t-ger-0: #8ec9ff; --t-ger-1: #4aadff; --t-ger-2: #008ee7; --t-ger-3: #0070b8;
    --t-ine-0: #8b8eff; --t-ine-1: #6f67fd; --t-ine-2: #5742e3; --t-ine-3: #4113c3;
    --t-trk-0: #eeae5d; --t-trk-1: #d39034; --t-trk-2: #b47300; --t-trk-3: #8d5900;
    --t-afa-0: #b2f46c; --t-afa-1: #92d73f; --t-afa-2: #74b800; --t-afa-3: #5e9600;
    --t-nkg-0: #5dc29e; --t-nkg-1: #33a781; --t-nkg-2: #008966; --t-nkg-3: #00684c;
    --t-asi-0: #ffa8c6; --t-asi-1: #ff70ab; --t-asi-2: #ed378e; --t-asi-3: #c70070;
    --t-aus-0: #dc67dd; --t-aus-1: #c143c3; --t-aus-2: #a40ca8; --t-aus-3: #7b007e;
    --t-oth-0: #c4ccd6; --t-oth-1: #a7afb9; --t-oth-2: #8a929c; --t-oth-3: #6c747f;
  }
}
:root[data-theme="dark"] {
  --bg:        #0d1014;
  --ocean:     #12151b;
  --land-mute: #272b33;
  --ink:       #eceef2;
  --ink-2:     #b3bac4;
  --ink-3:     #838d99;
  --rule:      rgba(236,238,242,.12);
  --sheet:     #191d24;
  --glass:     rgba(28,32,40,.62);
  --glass-2:   rgba(28,32,40,.84);
  --edge:      rgba(255,255,255,.10);
  --shade:     rgba(0,0,0,.45);
  --tint:      #62a8ff;
  --hatch:     rgba(236,238,242,.30);
  --border:   rgba(0,0,0,.66);
  --sub-line: rgba(255,255,255,.58);
  --g-rom: #db0002; --g-ger: #119efd; --g-ine: #6354f5; --g-trk: #c7810a;
  --g-afa: #81c90d; --g-nkg: #009a73; --g-asi: #ff4b9d; --g-aus: #b529b8;
  --g-oth: #99a1ac;
  --t-rom-0: #ff6150; --t-rom-1: #e63328; --t-rom-2: #c20000; --t-rom-3: #900000;
  --t-ger-0: #8ec9ff; --t-ger-1: #4aadff; --t-ger-2: #008ee7; --t-ger-3: #0070b8;
  --t-ine-0: #8b8eff; --t-ine-1: #6f67fd; --t-ine-2: #5742e3; --t-ine-3: #4113c3;
  --t-trk-0: #eeae5d; --t-trk-1: #d39034; --t-trk-2: #b47300; --t-trk-3: #8d5900;
  --t-afa-0: #b2f46c; --t-afa-1: #92d73f; --t-afa-2: #74b800; --t-afa-3: #5e9600;
  --t-nkg-0: #5dc29e; --t-nkg-1: #33a781; --t-nkg-2: #008966; --t-nkg-3: #00684c;
  --t-asi-0: #ffa8c6; --t-asi-1: #ff70ab; --t-asi-2: #ed378e; --t-asi-3: #c70070;
  --t-aus-0: #dc67dd; --t-aus-1: #c143c3; --t-aus-2: #a40ca8; --t-aus-3: #7b007e;
  --t-oth-0: #c4ccd6; --t-oth-1: #a7afb9; --t-oth-2: #8a929c; --t-oth-3: #6c747f;
}

* { -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* [hidden] varsayılan olarak display:none verir ama her display kuralı onu
   eziyor — .searchbar (flex), .seg (flex), .scale (flex) hep böyleydi. Aynı
   hataya üç kez düştükten sonra kaideye taşındı. */
[hidden] { display: none !important; }

/* Cam yüzey: arkasını bulanıklaştırıp doygunlaştırır, üst kenarında ince bir
   parlama bırakır. Katmanlar birbirinin üstünde durduğunda derinlik hissi
   veren şey bu ince kenar + yumuşak gölge. */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(135%);
  backdrop-filter: blur(20px) saturate(135%);
  border: .5px solid var(--edge);
  box-shadow: 0 8px 30px var(--shade), inset 0 .5px 0 rgba(255,255,255,.30);
}
body.busy #map { shape-rendering: optimizeSpeed; }
body.busy .sheet { transition: none; }

/* ============================================================ harita ==== */
#stage { position: fixed; inset: 0; background: var(--ocean); overflow: hidden; }
#map { display: block; width: 100%; height: 100%; touch-action: none; }
/* Kaydırma compositor'da kalsın diye jest boyunca kendi katmanına alınıyor */
body.busy #map { will-change: transform; }
.sphere { fill: var(--ocean); }

/* kenar süslemeleri */
.orn { color: var(--ink-3); opacity: .44; pointer-events: none; transition: opacity .3s ease; }
body.zoomed .orn { opacity: 0; }
.orn use { stroke: currentColor; stroke-width: .85; stroke-linejoin: round; stroke-linecap: round; }
.orn-t {
  fill: currentColor; font-size: 13px; letter-spacing: .34em; font-weight: 500;
  opacity: .8; text-transform: uppercase;
}
@media (prefers-reduced-motion: no-preference) {
  .orn .bob  { animation: bob 7s ease-in-out infinite; }
  .orn .bob2 { animation: bob 9s ease-in-out infinite reverse; }
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-1.6px) rotate(.6deg); }
}
.graticule path { fill: none; stroke: var(--rule); stroke-width: .6; vector-effect: non-scaling-stroke; }
/* Ülke sınırı: koyu ve belirgin. Kıyıda okyanusa karışır (siluet bozulmaz),
   iki ülke arasında ise net bir ayrım çizgisi olur. */
.cty { stroke: var(--border); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.dot { stroke: var(--ocean); stroke-width: 1; vector-effect: non-scaling-stroke; }
.g-rom { fill: var(--g-rom); } .g-ger { fill: var(--g-ger); } .g-ine { fill: var(--g-ine); }
.g-afa { fill: var(--g-afa); } .g-nkg { fill: var(--g-nkg); } .g-aus { fill: var(--g-aus); }
.g-trk { fill: var(--g-trk); } .g-asi { fill: var(--g-asi); }
.g-oth { fill: url(#hatch); }
/* Ton basamakları: aile rengi aynı, dil başına açıklık farklı. Ayarlardan
   açılıyor; varsayılan kapalı. Kurallar tek bir .tone-on sınıfına bağlı, o
   yüzden açıp kapamak haritayı yeniden çizdirmiyor — sınıf değişiyor, o kadar.
   Basamak dili izliyor, ülkeyi değil — İspanyolca 20 ülkede de aynı ton.
   Kaç basamak gerektiği ülke komşuluk grafiğinin aile içinde boyanmasıyla
   bulundu; dokuz ailenin hiçbirinde dörtten fazlası gerekmiyor. Kreol ve
   resmî-uyuşmazlık desenleri aşağıda ve aynı özgüllükte, onlar kazanmaya
   devam ediyor. */
.tone-on .g-rom.t0 { fill: var(--t-rom-0); } .tone-on .g-rom.t1 { fill: var(--t-rom-1); } .tone-on .g-rom.t2 { fill: var(--t-rom-2); } .tone-on .g-rom.t3 { fill: var(--t-rom-3); }
.tone-on .g-ger.t0 { fill: var(--t-ger-0); } .tone-on .g-ger.t1 { fill: var(--t-ger-1); } .tone-on .g-ger.t2 { fill: var(--t-ger-2); } .tone-on .g-ger.t3 { fill: var(--t-ger-3); }
.tone-on .g-ine.t0 { fill: var(--t-ine-0); } .tone-on .g-ine.t1 { fill: var(--t-ine-1); } .tone-on .g-ine.t2 { fill: var(--t-ine-2); } .tone-on .g-ine.t3 { fill: var(--t-ine-3); }
.tone-on .g-trk.t0 { fill: var(--t-trk-0); } .tone-on .g-trk.t1 { fill: var(--t-trk-1); } .tone-on .g-trk.t2 { fill: var(--t-trk-2); } .tone-on .g-trk.t3 { fill: var(--t-trk-3); }
.tone-on .g-afa.t0 { fill: var(--t-afa-0); } .tone-on .g-afa.t1 { fill: var(--t-afa-1); } .tone-on .g-afa.t2 { fill: var(--t-afa-2); } .tone-on .g-afa.t3 { fill: var(--t-afa-3); }
.tone-on .g-nkg.t0 { fill: var(--t-nkg-0); } .tone-on .g-nkg.t1 { fill: var(--t-nkg-1); } .tone-on .g-nkg.t2 { fill: var(--t-nkg-2); } .tone-on .g-nkg.t3 { fill: var(--t-nkg-3); }
.tone-on .g-asi.t0 { fill: var(--t-asi-0); } .tone-on .g-asi.t1 { fill: var(--t-asi-1); } .tone-on .g-asi.t2 { fill: var(--t-asi-2); } .tone-on .g-asi.t3 { fill: var(--t-asi-3); }
.tone-on .g-aus.t0 { fill: var(--t-aus-0); } .tone-on .g-aus.t1 { fill: var(--t-aus-1); } .tone-on .g-aus.t2 { fill: var(--t-aus-2); } .tone-on .g-aus.t3 { fill: var(--t-aus-3); }
.tone-on .g-oth.t0 { fill: var(--t-oth-0); } .tone-on .g-oth.t1 { fill: var(--t-oth-1); } .tone-on .g-oth.t2 { fill: var(--t-oth-2); } .tone-on .g-oth.t3 { fill: var(--t-oth-3); }
/* Kreoller kendi rengini almaz: kaynak dilin renginin taramalı hâliyle çizilir. */
.crl.g-rom { fill: url(#hx-rom); } .crl.g-ger { fill: url(#hx-ger); }
.crl.g-ine { fill: url(#hx-ine); } .crl.g-afa { fill: url(#hx-afa); }
.crl.g-nkg { fill: url(#hx-nkg); } .crl.g-aus { fill: url(#hx-aus); }
.crl.g-trk { fill: url(#hx-trk); } .crl.g-asi { fill: url(#hx-asi); }
/* resmî dil katmanı: evin dili resmî listede hiç yoksa çapraz tarama */
.mism.g-rom { fill: url(#mx-rom); } .mism.g-ger { fill: url(#mx-ger); }
.mism.g-ine { fill: url(#mx-ine); } .mism.g-afa { fill: url(#mx-afa); }
.mism.g-nkg { fill: url(#mx-nkg); } .mism.g-aus { fill: url(#mx-aus); }
.mism.g-trk { fill: url(#mx-trk); } .mism.g-asi { fill: url(#mx-asi); }
.mism.g-oth { fill: url(#mx-oth); }
.subs, .sub-base { display: none; }
.subs.on, .sub-base.on { display: inline; }
/* Sınır hiyerarşisi
   ülke sınırı  : düz koyu çizgi (.outer bölge kipinde, .cty ülke kipinde)
   il/eyalet    : beyaz çekirdek (.inner)
   Zemin (.sbase) yalnızca dolgu; dış çeper ayrı ve tekilleştirilmiş bir ağ.
   Gerekçesi masaüstü şablonundaki açıklamada. */
.sbase { stroke: none; pointer-events: none; }
/* stroke yok ama vector-effect kalmalı: seçim ve vurgu kuralları
   kalınlığı bu özellik üzerinden CSS pikseline sabitliyor. */
.sub { stroke: none; vector-effect: non-scaling-stroke; }
.outer { fill: none; stroke: var(--border); stroke-width: 1.2;
         vector-effect: non-scaling-stroke; pointer-events: none; }
.inner { fill: none; stroke: var(--sub-line); stroke-width: 1;
         vector-effect: non-scaling-stroke; pointer-events: none; }
/* Bölge kipinde alt bölgeli ülkelerin ülke konturu gereksiz: aynı sınırı
   .outer çiziyor ve ülke yolu bölge dolgularının altında kalıyor. */
.subs-on .cty.hassub:not(.sel):not(.hit2) { stroke: none; }
.off { display: none; }          /* görüş alanı dışında */
.inner-g, .outer-g { display: none; }
.inner-g.on, .outer-g.on { display: inline; }
/* küçük ülkelerin görünmez dokunma hedefi (Singapur, Malta, Bahreyn…) */
.hitdot { fill: transparent; pointer-events: all; }
.subs.on ~ .hits { pointer-events: none; }   /* bölge kipinde bölgeler öncelikli */
.is-filtering .cty:not(.hit):not(.hit2), .is-filtering .dot:not(.hit):not(.hit2),
.is-filtering .sub:not(.hit):not(.hit2) { fill: var(--land-mute); }
.is-filtering .cty.hit2, .is-filtering .dot.hit2, .is-filtering .sub.hit2 {
  stroke: var(--c-min, var(--ink-2)); stroke-width: 1.2;
}
.cty.sel, .dot.sel, .sub.sel { stroke: var(--ink); stroke-width: 2; }
.pin { fill: none; stroke: var(--ink); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.map-label {
  fill: var(--ink); paint-order: stroke; stroke: var(--ocean); stroke-width: 3.4;
  stroke-linejoin: round; font-weight: 650; letter-spacing: .01em;
  vector-effect: non-scaling-stroke;
}

/* ============================================================ üst çubuk = */
.top {
  position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px);
  border-radius: 20px; padding: 9px 14px; display: flex; align-items: center; gap: 10px;
  z-index: 5;
}
.top h1 { font-size: .9375rem; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.top p { margin: 0; font-size: .75rem; color: var(--ink-3); line-height: 1.25; }
.top .grow { min-width: 0; flex: 1; }
.top h1, .top p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .x {
  flex: none; width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center;
  background: var(--rule); font-size: .9rem; color: var(--ink-2);
}

.top .x svg { width: 17px; height: 17px; display: block; }
.top .x svg * { fill: none; stroke: currentColor; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }
.top .x[aria-expanded="true"] { background: var(--tint); color: #fff; }
/* Paylaş menüsü: iki satır, simgenin altına yapışık. Eski "her şey tek kartta"
   kalabalığını geri getirmemek için bilerek yalnız iki seçenek var. */
.shm {
  position: fixed; right: 12px; top: calc(env(safe-area-inset-top) + 58px); z-index: 12;
  background: var(--sheet); border: .5px solid var(--edge); border-radius: 14px;
  box-shadow: 0 10px 30px var(--shade); overflow: hidden; display: grid; min-width: 132px;
}
.shm button { padding: 12px 16px; text-align: left; font-size: .9375rem; color: var(--ink); }
.shm button + button { border-top: .5px solid var(--rule); }
.shm button:active { background: var(--rule); }
@media (prefers-reduced-motion: no-preference) {
  .shm:not([hidden]) { animation: pop .2s cubic-bezier(.2,1.1,.3,1) both; transform-origin: 90% 0; }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.95); } }
}

/* ============================================================ araçlar === */
.tools {
  position: fixed; right: 12px; z-index: 5; display: grid; gap: 1px;
  border-radius: 18px; overflow: hidden; padding: 1px;
  transition: bottom .34s cubic-bezier(.22,.9,.24,1), opacity .2s ease, transform .2s ease;
  transform-origin: 100% 100%;
}
/* Panel yukarı çıkıp haritayı kapatınca araçlar çekilir — üst çubuğun altına
   sıkışıp kırpılmaktansa (Apple Maps de panel açılınca denetimleri gizler). */
.tools.away { opacity: 0; transform: scale(.86); pointer-events: none; }
.tools button {
  width: 46px; height: 44px; display: grid; place-items: center;
  font-size: 1.15rem; font-weight: 500; color: var(--ink);
}
.tools button:active { background: var(--rule); }
.tools button[aria-pressed="true"] { background: var(--tint); color: #fff; }
.tools .lbl { font-size: .625rem; letter-spacing: .04em; text-transform: uppercase; }

/* ====================================================== sekme çubuğu === */
/* iOS'ta tab bar, Android'de navigation bar. İkisinin de kuralı aynı:
   sekme bir *varış noktası*, bir kip değil. Dört varış noktası — harita,
   dil dizini, bildiğin diller, ayarlar — ve her biri tek dokunuşla, hep
   aynı yerde. Bunların hepsi eskiden tek bir yüzen kartın içinde üst üste
   duruyordu; neyin nerede olduğu görünmüyordu. */
/* Çubuk cam değil opak: panel en alçak duraktayken gövdesi çubuğun arkasından
   aşağı kayıyor ve camın ardından liste satırları okunacak kadar net kalıyordu —
   iki metin üst üste biniyordu. Apple'ın tab bar'ı da arkasında içerik varken
   opaklaşır. */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--sheet); border-top: .5px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs button {
  position: relative; display: grid; justify-items: center; align-content: center;
  gap: 3px; padding: 7px 2px; min-height: 50px; color: var(--ink-3);
  font-size: .625rem; font-weight: 550; letter-spacing: .005em;
}
.tabs button svg { width: 26px; height: 22px; display: block; }
.tabs button svg * {
  fill: none; stroke: currentColor; stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
}

/* Katmanın renk anahtarı: masaüstündeki yan panelin karşılığı */

/* ============================================================ sayfa ===== */
/* Panel haritanın üstünde yüzerken cam, yukarı çekilince opak.
   Pahalı olan durum "geniş bulanık alan + hareket eden harita"ydı; panel
   büyüdüğünde camı bırakınca o durum hiç oluşmuyor. Değişim de harita
   sürüklenirken değil, paneli sen çekerken ve onun animasyonuyla birlikte

.sheet {
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(135%);
  backdrop-filter: blur(20px) saturate(135%);
  border: .5px solid var(--edge); border-bottom: 0;
  box-shadow: 0 -6px 30px var(--shade);
  transition: transform .34s cubic-bezier(.22,.9,.24,1),

  position: fixed; left: 0; right: 0; bottom: var(--tabh); z-index: 10;
  height: calc(92vh - var(--tabh)); border-radius: 22px 22px 0 0; padding: 0;
  display: flex; flex-direction: column;

}
.sheet.dragging { transition: none; }
/* Tutamak: çizgi ince görünür ama dokunma alanı iOS ölçüsünde (44px). */

  touch-action: none; min-height: 44px;
}

  display: block; width: 44px; height: 6px; border-radius: 3px;
  background: var(--ink-3); opacity: .42; transition: opacity .2s ease, width .2s ease;
}
.sheet.dragging .grab i, .grab:active i { opacity: .7; width: 52px; }
.sheet-head {
  flex: none; padding: 0 14px 11px; display: grid; gap: 9px; touch-action: none;
  border-bottom: .5px solid transparent; transition: border-color .2s ease;
}
.sheet-head.stuck { border-bottom-color: var(--rule); }
.searchbar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
  border-radius: 12px; background: var(--rule); }

  flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit;
  font-size: 1rem; outline: none; padding: 0;
}

/* ============================================================ listeler == */

/* ölçek */

/* ipucu */
.tip {
  position: fixed; z-index: 6; pointer-events: none; padding: 7px 11px; border-radius: 12px;
  font-size: .8125rem; opacity: 0; transition: opacity .15s; max-width: 62vw;
}

/* ---------------------------------------------------------- animasyon */
@media (prefers-reduced-motion: no-preference) {
  /* renk ölçütü değişince ülkeler yumuşak geçsin (hareket sırasında kapalı) */
  body:not(.busy) .cty, body:not(.busy) .sub, body:not(.busy) .dot, body:not(.busy) .sbase {

  .row:active, .tools button:active, .chip:active { transform: scale(.97); }

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("data").textContent);
  const C = D.countries, LG = D.langs, GR = D.groups, SB = D.subs || {};
  const GORDER = ["rom", "ger", "ine", "trk", "afa", "nkg", "asi", "aus", "oth"];
  // Katmanlar: aynı ülkelere üç ayrı soru — evde konuşulan dil, o dilin
  // yazısı, devletin resmî dili. Renkler ortak, gösterge katmanla değişiyor.
  const SCR = D.scripts || {}, SGR = D.sgroups || {};
  // Karşılıklı anlaşılırlık ağı ve ad -> dil araması (mix/l2 adla geliyor).
  const KIN = D.kin || {};
  const LGN = {};
  for (const s in LG) LGN[LG[s].n] = LG[s];
  const SGORDER = ["lat", "cyr", "ara", "brh", "sea", "cjk", "alp", "gez", "oth"];
  const SGCOL = { lat: "ger", cyr: "rom", ara: "afa", brh: "ine", sea: "asi",
                  cjk: "aus", alp: "trk", gez: "nkg", oth: "oth" };
  const offOf = (cid) => C[cid] && C[cid].o && C[cid].o.length ? C[cid].o[0] : null;
  // "Bildiğim diller": seçilen dillerle bir ülkedeki kaç kişiyle
  // anlaşılabileceği. Paylar toplanıp %100'de kırpılıyor (üst sınır).
  const KNOW_BINS = [5, 20, 45, 70, 90];
  // "Bildiğim diller" şeridi: kırmızıdan yeşile. Eskisi tek tonun koyudan
  // açığa gitmesiydi ve komşu kutuların en küçük CIEDE2000 farkı 4,5'ti —
  // Çin ile Afganistan ayırt edilemiyordu. Bu şeritte en kötü komşu farkı
  // 9,5; normal görme ve üç renk körlüğü türünün hepsinde ölçüldü.
  const KNOW_RAMP = ["#752110", "#8d4700", "#9c6f08", "#a29738", "#9fc06b", "#95e8a7"];
  // Sıfır kendi rengini alıyor: hiç kimseyle konuşamadığın ülke ile
  // %0,9 konuşabildiğin ülke aynı kutuya düşüyordu (bkz. masaüstü).
  const KNOW_ZERO = "#4a1226";
  const knowCol = (v) => (v < .05 ? KNOW_ZERO : KNOW_RAMP[binOf(v, KNOW_BINS)]);
  const known = new Set((localStorage.getItem("wl-known") || "").split(",").filter(Boolean));
  // İki okuma biçimi: pay (nüfusun oranı) ve yalnız evin dili olduğu yerler.
  let knowMode = localStorage.getItem("wl-knowmode") === "home" ? "home" : "share";
  const speaksHome = (o) => !!(o && known.has(o.l));
  // Masaüstünde bu bilgiyi fare ipucu veriyor; telefonda imleç yok, o yüzden
  // yer kartında duruyor: halkın yüzde kaçıyla anlaşılabileceği, kaç kişi
  // ettiği ve paya en çok katkı veren üç dil.
  function knowLine(cid, c) {
    if (state.layer !== "know" || !known.size || knowMode === "home") return "";
    const v = reach(cid);
    const best = bilinenKatsayilar();
    const rows = [...ulkeDilleri(c)].map(([n, q]) => {
      const f = best.get(n) || 0;
      return [LGN[n], q * f, f];
    }).filter(([lg, q]) => lg && q > 0).sort((x, y) => y[1] - x[1]);
    const top = rows.length
      ? rows.slice(0, 3).map(([l, q]) => `${esc(ln(l))} ${pc(q)}`).join(" · ")
      : t().tipKnowNone;
    return `<p class="note know-line"><i style="background:${knowCol(v)}"></i>` +
      `<b>${t().tipKnow(pc(Math.round(v * 10) / 10))}</b>` +
      (c.pop ? ` · ≈ ${fmtK(c.pop * v / 100)} / ${fmtK(c.pop)}` : "") +
      `<span>${top}</span></p>`;
  }
  // Kartın üstündeki yüzde "bu dili konuşanlar", aşağıdaki liste ise "evde
  // konuşulan ana dil". Yan yana düşünce çelişki gibi okunuyordu (İsveç
  // %95 / %85); fark varsa ikisini bağdaştıran satır yazılıyor.
  function homeGap(c) {
    const nm = LG[c.l] && LG[c.l].n;
    const row = nm && (c.mix || []).find(([n]) => n === nm);
    if (!row || Math.abs(c.p - row[1]) < 1.5) return "";
    return `<p class="note">${esc(t().speaksNote(pc(row[1])))}</p>`;
  }
  // Bildiğim sekmesinin kart rakamları: pay, kişi, nüfus. Aynı üçlü kalıp
  // ama ölçtüğü şey senin dillerin.
  function reachFigs(cid, c) {
    const v = reach(cid);
    return `<div class="stat">
        <div><b class="num">${pc(Math.round(v * 10) / 10)}</b><span>${t().kReach}</span></div>
        <div><b class="num">${c.pop ? fmtK(c.pop * v / 100) : "—"}</b><span>${t().kReachPpl}</span></div>
        <div><b class="num">${c.pop ? fmtK(c.pop) : "—"}</b><span>${t().pop}</span></div>
      </div>`;
  }
  // Paya katkı veren diller, payı büyükten küçüğe. Eskiden bu satır kartın
  // en küçük yazısıydı.
  function reachLangs(cid, c) {
    const m = new Map((c.mix || []).map(([n, q]) => [n, q]));
