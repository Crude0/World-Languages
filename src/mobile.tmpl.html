    // yerleşim dıştaki g'de, salınım animasyonu içteki use'da: CSS transform
    // öğenin transform niteliğini ezdiği için ikisi ayrı katmanda durmalı
    const put = (n, x, y, s, extra) =>
      `<g transform="translate(${x} ${y}) scale(${s})">` +
      `<use href="#o-${n}"${extra ? ` class="${extra}"` : ""}/></g>`;
    // Üst çubuk ile panelin altında kalmasınlar diye motifler payın harita
    // tarafına yakın yarısına, x boyunca da seyrek ve düzensiz dağıtıldı.
    const items = [
      put("rose", 120, -46, 1.98), put("ship", 330, -42, 1.65, "bob"),
      put("wave", 470, -30, 1.65), put("serpent", 640, -44, 1.65, "bob2"),
      put("ship", 880, -40, 1.48, "bob2"), put("wave", 1030, -28, 1.48),
      put("rose", 1180, -48, 1.65), put("ship", 1330, -42, 1.40, "bob"),
      put("serpent", 180, H + 30, 1.57, "bob"), put("wave", 360, H + 22, 1.65),
      put("ship", 520, H + 30, 1.57, "bob2"), put("rose", 780, H + 34, 1.73),
      put("wave", 960, H + 22, 1.48), put("ship", 1130, H + 28, 1.40, "bob"),
      put("serpent", 1310, H + 30, 1.48, "bob2"),
    ].join("");
    return `<defs>${defs}</defs><g class="orn" aria-hidden="true">${items}` +
      `<text class="orn-t" x="700" y="${H + 74}" text-anchor="middle">HIC SVNT DRACONES</text>` +
      `<text class="orn-t" x="430" y="-72" text-anchor="middle">MARE INCOGNITVM</text></g>`;
  }

  /* ------------------------------------------------------------ harita */
  const svg = $("#map"), stage = $("#stage");
  const W = D.w, H = D.h, DOT_AT = 2.2, HIT_AT = 26;
  const order = ids.slice().sort((a, b) => C[b].a - C[a].a);
  svg.innerHTML =
    `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
       <rect width="7" height="7" fill="var(--g-oth)"></rect>
       <line x1="0" y1="0" x2="0" y2="7" stroke="var(--hatch)" stroke-width="1.6"></line>
     </pattern>` +
     GORDER.filter((g) => g !== "oth").map((g) =>
       `<pattern id="hx-${g}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="var(--g-${g})"></rect>
          <line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="1.5"></line>
        </pattern>`).join("") +
     GORDER.map((g) =>
       `<pattern id="mx-${g}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="var(--g-${g})"></rect>
          <line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="1.3"></line>
          <line x1="0" y1="0" x2="6" y2="0" stroke="var(--hatch)" stroke-width="1.3"></line>
        </pattern>`).join("") + `</defs>` +
    ornaments() +
    `<path class="sphere" d="${D.frame}"></path>` +
    `<g class="graticule"><path d="${D.grat}"></path></g>` +
    `<g class="lands">` + order.map((id) =>
      `<path class="cty ${gcls(C[id], id)}${subsOf[id] ? " hassub" : ""}" data-id="${id}" d="${C[id].d}"></path>`).join("") + `</g>` +
    `<g class="sub-base">` + Object.keys(subsOf).map((cid) =>
      `<path class="sbase ${gcls(C[cid], cid)}" data-id="${cid}" d="${
        subsOf[cid].map((s) => SB[s].d).join("")}"></path>`).join("") + `</g>` +
    `<g class="subs">` + subIds.map((sid) =>
      `<path class="sub ${gcls(SB[sid], SB[sid].p)}" data-sid="${sid}" d="${SB[sid].d}"></path>`).join("") + `</g>` +
    // Ülkenin dış çeperi; bölge dolgularının üstünde (masaüstü şablonundaki
    // açıklamaya bak).
    `<g class="outer-g">` + Object.values(D.outer || {}).flat().map((d) =>
      `<path class="outer" d="${d}"></path>`).join("") + `</g>` +
    `<g class="dots">` + order.filter((id) => C[id].a < DOT_AT).map((id) =>
      `<circle class="dot ${gcls(C[id], id)}" data-id="${id}" cx="${C[id].c[0]}" cy="${C[id].c[1]}" r="3"></circle>`).join("") + `</g>` +
    `<g class="inner-g">` + Object.values(D.inner || {}).flat().map((d) =>
      `<path class="inner" d="${d}"></path>`).join("") + `</g>` +
    `<g class="hits">` + order.filter((id) => C[id].a < HIT_AT).map((id) =>
      `<circle class="hitdot" data-id="${id}" cx="${C[id].c[0]}" cy="${C[id].c[1]}" r="11"></circle>`).join("") + `</g>` +
    `<g class="marks"></g>`;
  const marks = svg.querySelector(".marks"), subG = svg.querySelector(".subs"),
        baseG = svg.querySelector(".sub-base"), innerG = svg.querySelector(".inner-g"),
        outerG = svg.querySelector(".outer-g");
  const nodesOf = (id) => svg.querySelectorAll(`[data-id="${id}"]`);
  const subNode = (sid) => subG.querySelector(`[data-sid="${CSS.escape(sid)}"]`);

  // Görüş kutusu ekranın oranını izler: dünya görünümünde harita genişliğe
  // oturur, artan yer okyanus olur. Telefonun dik oranında doğru davranış bu.
  let vb = { x: 0, y: 0, w: W, h: W };
  const aspect = () => stage.clientHeight / Math.max(1, stage.clientWidth);
  const maxW = () => Math.min(W, (H + 2 * PAD) / aspect());
  // 160x: Singapur, Malta, Lüksemburg ve il merkezleri rahat seçilebilsin
  const clampW = (w) => Math.min(maxW(), Math.max(W / 160, w));

  let raf = 0, busy = false;
  // Not: bir ara jest boyunca viewBox'ı dondurup katmanı CSS dönüşümüyle
  // kaydırmayı denedim. Hızlıydı ama yanlıştı: compositor yalnızca zaten
  // çizilmiş pikselleri taşıyabildiği için kaydırırken kenarda boş alan
  // kalıyordu. Her kare gerçek viewBox yazılıyor; rAF ile kareye bir kez.
  function clampVB() {
    vb.w = clampW(vb.w);
    vb.h = vb.w * aspect();
    vb.x = vb.w >= W ? (W - vb.w) / 2 : Math.min(W - vb.w, Math.max(0, vb.x));
    vb.y = vb.h >= H + 2 * PAD ? (H - vb.h) / 2
                               : Math.min(H + PAD - vb.h, Math.max(-PAD, vb.y));
  }
  function applyVB() {                      // kareye bir kez uygula
    if (buf) endBuffer();
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; commitVB(); });
  }

  /* ------------------------------------------------- jest tamponu
     Masaüstünde ölçülen sorun burada da aynen var: viewBox her karede
     değişince katmanın tamamı geçersizleşiyor ve her karo yeniden
     rasterize ediliyor. Telefonda ölçüldü (Avrupa, bölge kipi, 1 sn
     kaydırma): 398 ms raster / 613 iş; konturların hepsini kapatmak
     371 ms, yani kontur değil.

     Jest boyunca viewBox donduruluyor, katman CSS dönüşümüyle
     kaydırılıyor. Görünenin her kenarından %28 fazlası çizildiği için
     kaydırılan yönde boşluk kalmıyor; pay tükenince tampon yenileniyor. */
  const BUFPAD = 0.28;
  let buf = null;
  function beginBuffer() {
    if (buf) return;
    const r = mapRect();
    if (!r.width || !r.height) return;
    const mx = Math.round(r.width * BUFPAD), my = Math.round(r.height * BUFPAD);
    const sc = vb.w / r.width;
    buf = { x: vb.x - mx * sc, y: vb.y - my * sc,
            w: vb.w + 2 * mx * sc, h: vb.h + 2 * my * sc,
            mx, my, sc, ox: vb.x, oy: vb.y };
    svg.style.position = "absolute";
    svg.style.left = -mx + "px";
    svg.style.top = -my + "px";
    svg.style.width = (r.width + 2 * mx) + "px";
    svg.style.height = (r.height + 2 * my) + "px";
    svg.setAttribute("viewBox",
      `${buf.x.toFixed(2)} ${buf.y.toFixed(2)} ${buf.w.toFixed(2)} ${buf.h.toFixed(2)}`);
    cull(buf);
  }
  function panBuffer() {
    if (!buf) { applyVB(); return; }
    clampVB();
    const dx = (buf.ox - vb.x) / buf.sc, dy = (buf.oy - vb.y) / buf.sc;
    if (Math.abs(dx) > buf.mx || Math.abs(dy) > buf.my) {
      endBuffer(); beginBuffer(); panBuffer();
      return;
    }
    svg.style.transform = `translate3d(${dx.toFixed(1)}px, ${dy.toFixed(1)}px, 0)`;
  }
  function endBuffer() {
    if (!buf) return;
    buf = null;
    svg.style.transform = "";
    svg.style.position = ""; svg.style.left = ""; svg.style.top = "";
    svg.style.width = ""; svg.style.height = "";
    rectCache = null;
    commitVB();
  }
  /* ------------------------------------------------- görüş alanı budaması
     Ekranın dışında kalan yolu çizdirmenin anlamı yok. Sınırlayıcı kutular
     bir kez hesaplanıyor (getBBox pahalı), sonra her karede yalnızca kutu
     kesişimi bakılıyor — 550 karşılaştırma, ihmal edilebilir. Avrupa'ya
     yaklaşmışken dünyanın geri kalanı çizim dışı kalıyor. */
  let cullList = null;
  function buildCull() {
    cullList = [];
    const nodes = svg.querySelectorAll(".cty, .sub, .sbase, .outer, .inner, .dot, .hitdot");
    // getBBox gizli öğe için 0x0 döner; liste yeniden kurulurken gizli olan
    // yollar listeden düşer ve bir daha geri gelmezdi.
    nodes.forEach((n) => n.classList.remove("off"));
    nodes.forEach((n) => {
      try {
        const b = n.getBBox();
        if (b.width || b.height) cullList.push([n, b.x, b.y, b.x + b.width, b.y + b.height]);
      } catch (_) { /* çizilmemiş yol */ }
    });
  }
  // win verilirse ona göre budanır: jest tamponu görünenden geniş çiziliyor,
  // görünür kutuya göre budarsak kaydırınca kenarda delik kalır.
  function cull(win) {
    if (!cullList) buildCull();
    const r = win || vb;
    const m = r.w * 0.08;                        // küçük pay: kenarda pop olmasın
    const x0 = r.x - m, y0 = r.y - m, x1 = r.x + r.w + m, y1 = r.y + r.h + m;
    for (let i = 0; i < cullList.length; i++) {
      const c = cullList[i];
      const off = c[3] < x0 || c[1] > x1 || c[4] < y0 || c[2] > y1;
      if (off !== (c[5] === 1)) { c[0].classList.toggle("off", off); c[5] = off ? 1 : 0; }
    }
  }
  /* --------------------------------------------- geometri ayrıntı düzeyi
     Konturun maliyeti boyadığı piksele bağlı ve dünya görünümünde ülke
     yollarının noktalarının çoğu piksel altı ayrıntı. Ölçtüm: 20 547 noktayı
     7 715'e indirmek rasterizasyonu %58 düşürüyor, görüntüde fark yok. Kaba
     sürüm açılıştan sonra bir kez hesaplanıyor, veriye eklenmiyor. */
  function rdp(pts, tol) {
    if (pts.length < 3) return pts;
    const keep = new Array(pts.length).fill(false);
    keep[0] = keep[pts.length - 1] = true;
    const st = [[0, pts.length - 1]], t2 = tol * tol;
    while (st.length) {
      const [a, b] = st.pop();
      if (b <= a + 1) continue;
      const ax = pts[a][0], ay = pts[a][1];
      const dx = pts[b][0] - ax, dy = pts[b][1] - ay, d2 = dx * dx + dy * dy;
      let worst = -1, idx = -1;
      for (let i = a + 1; i < b; i++) {
        const px = pts[i][0], py = pts[i][1];
        let dist;
        if (!d2) dist = (px - ax) * (px - ax) + (py - ay) * (py - ay);
        else {
          let t = ((px - ax) * dx + (py - ay) * dy) / d2;
          t = t < 0 ? 0 : t > 1 ? 1 : t;
          const cx = ax + t * dx, cy = ay + t * dy;
          dist = (px - cx) * (px - cx) + (py - cy) * (py - cy);
        }
        if (dist > worst) { worst = dist; idx = i; }
      }
      if (worst > t2) { keep[idx] = true; st.push([a, idx], [idx, b]); }
    }
    return pts.filter((_, i) => keep[i]);
  }
  function simplifyPath(d, tol) {
    const out = [];
    for (const sub of d.split("M").slice(1)) {
      const close = sub.endsWith("Z");
      const body = close ? sub.slice(0, -1) : sub;
      const pts = body.split("L").map((s) => { const p = s.split(" "); return [+p[0], +p[1]]; });
      const s = rdp(pts, tol);
      if (s.length < 3) { out.push("M" + body + (close ? "Z" : "")); continue; }
      out.push("M" + s.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + (close ? "Z" : ""));
    }
    return out.join("");
  }
  const GEO_COARSE = 1.0, GEO_FINE = 1.3;   // piksel/birim, histerezisli
  const GEO_TOL = 0.7;                      // kaba düzeyin sadeleştirme payı
  let geo = null, geoLevel = "fine";
  function buildGeo() {
    geo = [];
    svg.querySelectorAll(".cty").forEach((n) => {
      const d = n.getAttribute("d");
      geo.push([n, d, simplifyPath(d, GEO_TOL)]);
    });
  }
  function applyGeoLod() {
    if (!geo) return;
    const k = mapScale();
    const want = geoLevel === "coarse" ? (k > GEO_FINE ? "fine" : "coarse")
                                       : (k < GEO_COARSE ? "coarse" : "fine");
    if (want === geoLevel) return;
    geoLevel = want;
    const i = want === "coarse" ? 2 : 1;
    for (const g of geo) g[0].setAttribute("d", g[i]);
    cullList = null;                     // sınırlayıcı kutular değişti
  }
  function commitVB() {
    clampVB();
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    if (!busy) refineMarks();               // parmak üzerindeyken atlanır
    document.body.classList.toggle("zoomed", vb.w < maxW() * .62);
    applyLod();
    applyGeoLod();
    cull();
    queueHash();
  }
  // Bir CSS pikselinin kaç harita birimi ettiği. İşaretleri buna göre
  // ölçekleyince yakınlaşmadan ve ekran genişliğinden bağımsız sabit kalırlar.
  // Ölçüyü #map'ten değil #stage'ten alıyoruz: jest sırasında #map'e CSS
  // dönüşümü uyguluyoruz ve getBoundingClientRect onu da hesaba katardı.
  let rectCache = null;
  const mapRect = () => rectCache || (rectCache = stage.getBoundingClientRect());
  const unit = () => vb.w / Math.max(1, mapRect().width);
  addEventListener("resize", () => { rectCache = null; });
  addEventListener("scroll", () => { rectCache = null; }, true);
  let dotNodes = null, hitNodes = null;
  function refineMarks() {
    const u = unit();
    if (!dotNodes) dotNodes = svg.querySelectorAll(".dot");
    dotNodes.forEach((d) => d.setAttribute("r", (3 * u).toFixed(2)));
    if (!hitNodes) hitNodes = svg.querySelectorAll(".hitdot");
    hitNodes.forEach((d) => d.setAttribute("r", (11 * u).toFixed(2)));
    marks.querySelectorAll(".pin").forEach((p) => p.setAttribute("r", (8 * u).toFixed(2)));
    const lbl = marks.querySelector(".map-label");
    if (lbl) lbl.setAttribute("font-size", (14 * u).toFixed(2));
  }
  // Cam bulanıklığı ve ince ayarlar hareket sırasında kapanır: telefonda
  // her karede yeniden bulanıklaştırmak en pahalı iş.
  function setBusy(on) {
    if (busy === on) return;
    busy = on;
    document.body.classList.toggle("busy", on);
    if (!on) { endBuffer(); refineMarks(); applyVB(); }
  }
  const svgPt = (cx, cy) => {
    const r = mapRect();
    return { x: vb.x + (cx - r.left) * vb.w / r.width, y: vb.y + (cy - r.top) * vb.h / r.height };
  };
  function zoomAt(k, p) {
    const nw = clampW(vb.w * k), r = nw / vb.w;
    vb.x = p.x - (p.x - vb.x) * r; vb.y = p.y - (p.y - vb.y) * r; vb.w = nw; applyVB();
  }
  // Görünür bant: üstte cam çubuk, altta panel. Seçilen yer ikisinin de
  // altında kalmasın diye kutuyu bu bandın ortasına oturtuyoruz.
  const TOPBAR = 86;
  function zoomTo(cx, cy, w) {
    vb.w = clampW(w); vb.h = vb.w * aspect();
    vb.x = cx - vb.w / 2;
    const st = stage.clientHeight || 1;
    const bot = sheetTop || st;
    vb.y = cy - vb.h * ((TOPBAR + bot) / 2 / st);
    applyVB();
  }
  $("#btnIn").onclick = () => zoomAt(1 / 1.7, { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
  $("#btnOut").onclick = () => zoomAt(1.7, { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
  $("#btnFit").onclick = () => homeView();
  // En geniş görünüm: harita ekranı tam kaplar, Avrupa–Akdeniz ortada.
  function homeView() {
    vb.w = maxW(); vb.h = vb.w * aspect();
    vb.x = 700 - vb.w / 2; vb.y = 200 - vb.h / 2;
    applyVB();
  }

  /* --------------------------------------------------- dokunma / gezinme */
  const pts = new Map();
  let drag = null, pinch = null;
  const spread = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const midC = () => { const [a, b] = [...pts.values()];
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  svg.addEventListener("pointerdown", (e) => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      drag = null; rectCache = null;
      const c = midC();
      // jest boyunca sabit kalacak harita noktası — parmakların altındaki yer
      pinch = { d: spread(), w: vb.w, p: svgPt(c.x, c.y) };
      return;
    }
    if (pts.size > 2) return;
    const t = e.target.closest("[data-id]"), ts = subOn ? e.target.closest("[data-sid]") : null;
    drag = { sx: e.clientX, sy: e.clientY, vx: vb.x, vy: vb.y, moved: false,
             id: t ? t.dataset.id : null, sid: ts ? ts.dataset.sid : null };
    rectCache = null;
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", (e) => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      const d = spread();
      if (d > 4) {
        setBusy(true);
        const r = mapRect(), c = midC();
        vb.w = clampW(pinch.w * pinch.d / d);
        vb.h = vb.w * aspect();
        // pinch.p, parmakların şu anki orta noktasının altında kalsın:
        // hem sıçrama olmuyor hem iki parmakla kaydırma da çalışıyor
        vb.x = pinch.p.x - ((c.x - r.left) / r.width) * vb.w;
        vb.y = pinch.p.y - ((c.y - r.top) / r.height) * vb.h;
        applyVB();
      }
      return;
    }
    if (!drag) { hover(e); return; }
    // Ölçü #map'ten değil #stage'ten: jest tamponu #map'i görünenden büyük
    // çiziyor, svg'nin kutusunu ölçersek harita parmaktan yavaş kayıyor.
    const r = mapRect(), sc = vb.w / r.width;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) {
      drag.moved = true; tip.classList.remove("on"); setBusy(true); beginBuffer();
    }
    vb.x = drag.vx - dx * sc; vb.y = drag.vy - dy * sc;
    if (drag.moved) panBuffer(); else applyVB();
  });
  const endPtr = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) setBusy(false);
    if (drag && !drag.moved && !e.__cancel) {
      let { id, sid } = drag;
      // Parmak ucu bir noktadan geniştir: tam isabet yoksa çevrede ara.
      // Singapur, Malta, Bahreyn gibi yerler böyle seçilebiliyor.
      if (!id && !sid) {
        const hit = nearHit(e.clientX, e.clientY);
        if (hit) { id = hit.id; sid = hit.sid; }
      }
      if (sid) select(SB[sid].p, sid);
      else if (id) select(id);
      else select(null);
    }
    drag = null;
  };
  // dokunulan noktanın çevresini halka halka tarayarak en yakın alanı bul
  const RINGS = [0, 10, 18, 26];
  function nearHit(cx, cy) {
    for (const r of RINGS) {
      const steps = r === 0 ? 1 : 8;
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * 2 * Math.PI;
        const el = document.elementFromPoint(cx + r * Math.cos(a), cy + r * Math.sin(a));
        if (!el || !el.closest) continue;
        const ts = subOn ? el.closest("[data-sid]") : null;
        if (ts) return { sid: ts.dataset.sid, id: null };
        const t = el.closest("[data-id]");
        if (t) return { id: t.dataset.id, sid: null };
      }
    }
    return null;
  }
  svg.addEventListener("pointerup", endPtr);
  svg.addEventListener("pointercancel", (e) => { e.__cancel = true; endPtr(e); });
  // Masaüstü tarayıcı için. Fare tekerleği yakınlaştırır, dokunmatik yüzeyde
  // iki parmak kaydırma haritayı kaydırır, kıstırma yakınlaştırır.
  let wheelKind = null, wheelAt = 0;
  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey) { zoomAt(Math.exp(e.deltaY * 0.01), svgPt(e.clientX, e.clientY)); return; }
    const now = performance.now();
    if (now - wheelAt > 160) wheelKind = null;
    wheelAt = now;
    if (wheelKind === null) {
      wheelKind = e.deltaMode !== 0
        || (e.deltaX === 0 && Math.abs(e.deltaY) >= 48 && Number.isInteger(e.deltaY));
    }
    if (wheelKind) {
      zoomAt(Math.exp(e.deltaY * (e.deltaMode ? 0.004 : 0.0016)), svgPt(e.clientX, e.clientY));
      return;
    }
    const sc = vb.w / mapRect().width;
    vb.x += e.deltaX * sc; vb.y += e.deltaY * sc; applyVB();
  }, { passive: false });

  /* ------------------------------------------------------------- ipucu */
  const tip = $("#tip");
  function hover(e) {
    if (matchMedia("(pointer: coarse)").matches) return;   // dokunmatikte ipucu yok
    const ts = subOn ? e.target.closest("[data-sid]") : null;
    const o = ts ? SB[ts.dataset.sid] : null;
    const t = o ? null : e.target.closest("[data-id]");
    if (!o && !t) { tip.classList.remove("on"); return; }
    const c = o || C[t.dataset.id], l = LG[c.l];
    tip.innerHTML = `<b>${esc(o ? sn(c) : cn(c))}</b><span>${esc(l ? ln(l) : "")} · ${pc(o ? c.mix[0][1] : c.p)}</span>`;
    tip.style.left = Math.min(innerWidth - 12, Math.max(12, e.clientX)) + "px";
    tip.style.top = Math.max(70, e.clientY - 54) + "px";
    tip.classList.add("on");
  }

  /* ------------------------------------------------- ayrıntı düzeyi (LOD) */
  let subOn = false;
  // Otomatik geçişin ölçütü ekranın kesri değil, bir harita biriminin kaç piksel
  // ettiği. Böylece bölgeler telefonda da masaüstünde de aynı *görünür* ölçekte
  // açılıyor. Eski eşik W'nin kesri olarak yazılmıştı (W/1.5); telefonda en
  // geniş görünüm zaten W'nin çok altında kaldığı için bölgeler hiç kapanmıyor,
  // masaüstünde ise 1,5x gibi erken bir yakınlıkta açılıyordu.
  // 2.5 px/birim ≈ Türkiye ekranda ~170 piksel: iller okunur ama harita hâlâ
  // bölgesel. Eski masaüstü eşiği 1,5x (0,78 px/birim) idi, iki katından
  // fazla geç açılıyor artık. Elle "Bölge" seçimi bunu her zaman ezer.
  const LOD_ON = 2.5, LOD_OFF = 2.0;      // piksel / harita birimi (histerezis)
  const mapScale = () => mapRect().width / vb.w;
  function applyLod() {
    const k = mapScale();
    const want = state.lod === "on" ? true : state.lod === "off" ? false
      : (subOn ? k > LOD_OFF : k > LOD_ON);
    if (want !== subOn) setSubs(want);
  }
  function setSubs(on) {
    subOn = on;
    subG.classList.toggle("on", on);
    baseG.classList.toggle("on", on);
    outerG.classList.toggle("on", on);
    innerG.classList.toggle("on", on);
    svg.classList.toggle("subs-on", on);
    if (on) { markMap(); repaint(); }
    if (!on && state.selSub) select(state.sel);
  }

  /* ---------------------------------------------------------- boyama */
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function rgb(s) {
    if (s.startsWith("#")) {
      return s.length === 4 ? s.slice(1).split("").map((c) => parseInt(c + c, 16))
                            : [1, 3, 5].map((i) => parseInt(s.substr(i, 2), 16));
    }
    const m = s.match(/[\d.]+/g) || [128, 128, 128];
    return [+m[0], +m[1], +m[2]];
  }
  const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const PCT_BINS = [5, 15, 35, 60, 85], PPL_BINS = [10, 100, 1000, 10000, 100000];
  const STOPS = [0.2, 0.34, 0.5, 0.67, 0.84, 1];
  let ramp = [], rampKey = "";
  function buildRamp(hue) {
    const base = rgb(css("--land-mute")), top = rgb(css(hue)), ink = rgb(css("--ink"));
    ramp = STOPS.map((t, i) => {
      const c = mixc(base, top, t);
      const f = i === STOPS.length - 1 ? mixc(c, ink, 0.22) : c;
      return `rgb(${f[0]} ${f[1]} ${f[2]})`;
    });
  }
  const binOf = (v, bins) => { let i = 0; while (i < bins.length && v >= bins[i]) i++; return i; };
  function share(o) {
    const f = state.filter;
    if (f && f.t === "l") {
      const row = (o.mix || []).find(([n]) => n === LG[f.k].n);
      if (row) return row[1];
      return o.l === f.k ? (o.p !== undefined ? o.p : o.mix[0][1]) : null;
    }
    if (f && f.t === "g") return LG[o.l] && LG[o.l].g === f.k ? (o.p !== undefined ? o.p : o.mix[0][1]) : null;
    return o.p !== undefined ? o.p : (o.mix ? o.mix[0][1] : null);
  }
  function paintNode(n, o) {
    if (state.paint === "fam" || !o) { n.style.fill = ""; return; }
    const v = share(o);
    if (v == null) { n.style.fill = "var(--land-mute)"; return; }
    n.style.fill = ramp[state.paint === "pct" ? binOf(v, PCT_BINS)
      : binOf(o.pop ? o.pop * v / 100 : 0, PPL_BINS)];
  }
  function repaint() {
    // "Bildiğim diller" katmanı sürekli ölçekle boyanıyor
    if (state.layer === "know") {
      if (knowMode === "home") {
        const put = (n, o) => {
          n.style.fillOpacity = "";
          n.style.fill = !known.size ? ""
            : speaksHome(o) ? `var(--g-${LG[o.l].g})` : "var(--land-mute)";
        };
        svg.querySelectorAll(".cty, .dot, .sbase").forEach((n) => put(n, C[n.dataset.id]));
        svg.querySelectorAll(".sub").forEach((n) => put(n, SB[n.dataset.sid]));
        return;
      }
      if (rampKey !== "know") { ramp = KNOW_RAMP.slice(); rampKey = "know"; }
      const put = (n, cid) => {
        n.style.fill = known.size ? knowCol(reach(cid)) : "";
        n.style.fillOpacity = "";
      };
      svg.querySelectorAll(".cty, .dot").forEach((n) => put(n, n.dataset.id));
      svg.querySelectorAll(".sub").forEach((n) => {
        const sb = SB[n.dataset.sid]; if (sb) put(n, sb.p);
      });
      svg.querySelectorAll(".sbase").forEach((n) => put(n, n.dataset.id));
      return;
    }
    const f = state.filter;
    const hue = f && f.t === "l" ? `--g-${LG[f.k].g}` : (f && f.t === "g" ? `--g-${f.k}` : "--g-ger");
    const key = state.paint + "|" + hue;
    if (key !== rampKey) { buildRamp(hue); rampKey = key; }
    if (state.paint !== "fam") {
      svg.querySelectorAll(".cty, .dot").forEach((n) => paintNode(n, C[n.dataset.id]));
      svg.querySelectorAll(".sub").forEach((n) => paintNode(n, SB[n.dataset.sid]));
      svg.querySelectorAll(".sbase").forEach((n) => paintNode(n, C[n.dataset.id]));
    } else {
      svg.querySelectorAll(".cty, .dot, .sub, .sbase").forEach((n) => {
        n.style.fill = ""; n.style.fillOpacity = "";
      });
      styleMinor();
    }
  }

  /* ---------------------------------------------------------- vurgular */
  let lastMinor = [];
  function styleMinor() {
    const f = state.filter, mg = f && f.t === "l" ? LG[f.k].g : null;
    lastMinor.forEach(([i]) => nodesOf(i).forEach((n) => {
      if (state.paint !== "fam") { n.style.fill = ""; n.style.fillOpacity = ""; return; }
      n.style.fill = mg === "oth" ? "url(#hatch)" : `var(--g-${mg})`;
      n.style.fillOpacity = mg === "oth" ? ".4" : ".45";
    }));
  }
  function markMap() {
    const f = state.filter;
    svg.querySelectorAll(".hit, .hit2").forEach((n) => {
      n.classList.remove("hit", "hit2"); n.style.fill = ""; n.style.fillOpacity = "";
    });
    svg.classList.toggle("is-filtering", !!f);
    lastMinor = [];
    if (!f) return [];
    // Resmî dil katmanında dil süzgeci "nerede resmî" sorusunu soruyor
    const isMain = (o, cid) => f.t === "l"
      ? (state.layer === "off" ? (C[cid] && (C[cid].o || []).includes(f.k)) : o.l === f.k)
      : keyOf(o, cid) === f.k;
    ids.filter((i) => isMain(C[i], i))
      .forEach((i) => nodesOf(i).forEach((n) => n.classList.add("hit")));
    subIds.forEach((sid) => {
      const s = SB[sid], n = subNode(sid);
      if (!n) return;
      if (isMain(s, s.p)) n.classList.add("hit");
      else if (f.t === "l" && state.layer !== "off" &&
               (s.mix || []).some(([nm]) => nm === LG[f.k].n)) n.classList.add("hit2");
    });
    const minor = f.t === "l" && state.layer !== "off"
      ? (LG[f.k].in || []).filter(([i]) => C[i].l !== f.k) : [];
    const mg = f.t === "l" ? LG[f.k].g : null;
    svg.style.setProperty("--c-min", mg && mg !== "oth" ? `var(--g-${mg})` : "var(--ink-2)");
    minor.forEach(([i]) => nodesOf(i).forEach((n) => n.classList.add("hit2")));
    lastMinor = minor;
    styleMinor();
    return minor;
  }

  /* ------------------------------------------------------------- sayfa */
  const sheet = $("#sheet"), body = $("#body"), grab = $("#grab"), head = $("#head");
  const PEEK = 128;
  let detent = "peek", sheetTop = 0;         // peek | half | full
  // Her sekme kendi panel yüksekliğini hatırlar: haritada panel alçak durur,
  // dil dizininde tam açılır. Kullanıcı sürükleyince o sekme için güncellenir.
  const detentOf = { map: "peek", langs: "full", know: "half", settings: "full" };
  const heights = () => {
    const h = sheet.offsetHeight;
    return { peek: h - PEEK, half: h * 0.42, full: 0 };   // translateY değerleri
  };
  const sheetY = () => heights()[detent];
  // Yüzen katmanların yerleşimi tek elden. Araç sütunu panelin üstünde durur
  // ama üst çubuğun altına girmez; menü de araç sütununun üstünde açılır ve
  // ekranın dışına taşmaz. Eskiden ikisi de panele bakıp körlemesine
  // konumlanıyordu, panel yukarıdayken tepeden kırpılıyorlardı.
  const tools = $("#tools");
  const GAP = 12;
  function placeFloaters(top) {
    const st = stage.clientHeight || 1;
    const th = tools.offsetHeight || 183;
    const roof = st - (TOPBAR + 8) - th;             // daha yukarı çıkamaz
    const away = roof < GAP;                          // hiç yer yok
    const bottom = Math.min(Math.max(GAP, st - top + GAP), Math.max(GAP, roof));
    tools.style.bottom = bottom + "px";
    tools.classList.toggle("away", away);
  }
  function setDetent(d, quiet) {
    detent = d;
    sheet.classList.toggle("up", d !== "peek");
    const y = heights()[d];
    sheet.style.transform = `translate3d(0, ${y}px, 0)`;
    sheetTop = sheet.offsetTop + y;                  // araç sütunu ve harita için
    placeFloaters(sheetTop);
    if (!quiet) live(d === "peek" ? t().panelShut : t().panelOpen);
  }
  // sürükleme
  let sd = null;
  const startDrag = (e) => {
    if (e.target.closest("input, button")) return;
    sd = { y: e.clientY, base: heights()[detent], t: Date.now() };
    sheet.classList.add("dragging");
    tools.style.transition = "none";     // parmakla birlikte anında kaysın
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const moveDrag = (e) => {
    if (!sd) return;
    const y = Math.max(0, Math.min(heights().peek, sd.base + (e.clientY - sd.y)));
    sheet.style.transform = `translate3d(0, ${y}px, 0)`;
    placeFloaters(sheet.offsetTop + y);
    sd.last = y;
  };
  const endDrag = (e) => {
    if (!sd) return;
    sheet.classList.remove("dragging");
    tools.style.transition = "";
    const h = heights(), y = sd.last === undefined ? sd.base : sd.last;
    const v = (e.clientY - sd.y) / Math.max(1, Date.now() - sd.t);   // px/ms
    let d;
    if (v > 0.7) d = y > h.half ? "peek" : "half";
    else if (v < -0.7) d = y < h.half ? "full" : "half";
    else d = [["peek", h.peek], ["half", h.half], ["full", h.full]]
      .sort((a, b) => Math.abs(a[1] - y) - Math.abs(b[1] - y))[0][0];
    sd = null;
    detentOf[state.tab] = d;
    setDetent(d);
  };
  [grab, head].forEach((el) => {
    el.addEventListener("pointerdown", startDrag);
    el.addEventListener("pointermove", moveDrag);
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
  });
  grab.addEventListener("click", () => setDetent(detent === "peek" ? "half" : "peek"));

  // İçerikten aşağı çekince de kapansın: liste en üstteyken aşağı yönlü hareket
  // paneli sürükler, aksi hâlde normal kaydırma olur (iOS davranışı). Dokunmatikte
  // tarayıcı kaydırmayı kendi devraldığı için pointer değil touch olayları
  // kullanılıyor; devralmayı preventDefault ile kesiyoruz.
  let take = null;
  body.addEventListener("scroll", () => {
    head.classList.toggle("stuck", body.scrollTop > 2);
  }, { passive: true });
  body.addEventListener("touchstart", (e) => {
    take = e.touches.length === 1 ? { y: e.touches[0].clientY, on: false } : null;
  }, { passive: true });
  body.addEventListener("touchmove", (e) => {
    if (!take || e.touches.length !== 1) return;
    const y = e.touches[0].clientY, dy = y - take.y;
    if (!take.on) {
      if (body.scrollTop > 0 || dy < 10) { if (dy < -6) take = null; return; }
      take.on = true;
      sd = { y: take.y, base: heights()[detent], t: Date.now() };
      sheet.classList.add("dragging");
    }
    e.preventDefault();
    moveDrag({ clientY: y });
  }, { passive: false });
  const bodyEnd = (e) => {
    if (take && take.on) {
      const t = e.changedTouches && e.changedTouches[0];
      endDrag({ clientY: t ? t.clientY : sd ? sd.y : 0 });
    }
    take = null;
  };
  body.addEventListener("touchend", bodyEnd, { passive: true });
  body.addEventListener("touchcancel", bodyEnd, { passive: true });

  /* -------------------------------------------------------- içerik */
  const total = (s) => LG[s].c + LG[s].t;
  const spk = (s) => LG[s].s;
  function matches(slug) {
    if (!state.q) return true;
    const q = norm(state.q), l = LG[slug];
    if (norm(l.n).includes(q) || norm(l.e).includes(q) || norm(l.f).includes(q)
        || norm(l.ne || "").includes(q)) return true;
    return (l.in || []).some(([i]) => norm(C[i].n).includes(q) || norm(C[i].en).includes(q));
  }
  let lastKey = "";

  /* ------------------------------------------------------------ sekmeler */
  const tabs = $("#tabs");
  const hLayer = $("#hLayer"), hKnow = $("#hKnow"), hSearch = $("#hSearch");
  const TABLBL = () => ({ map: t().tabMap, langs: t().tabLangs,
                          know: t().tabKnow, settings: t().tabSet });
  function syncTabs() {
    const lbl = TABLBL();
    tabs.querySelectorAll("[data-tab]").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.tab === state.tab));
      b.lastElementChild.textContent = lbl[b.dataset.tab];
    });
    // Seçili dil sayısı sekmenin üstünde rozetle duruyor: kaç dil işaretlediğini
    // görmek için sekmeye girmen gerekmesin.
    const kb = tabs.querySelector('[data-tab="know"]');
    let badge = kb.querySelector(".cnt");
    if (known.size && !badge) kb.insertAdjacentHTML("afterbegin", `<b class="cnt num"></b>`);
    else if (!known.size && badge) { badge.remove(); badge = null; }
    badge = kb.querySelector(".cnt");
    if (badge) badge.textContent = known.size;
  }
  // Seçili bir yer varken harita sekmesi en alçak durakta kalırsa kart
  // görünmez; o durumda yarıya çıkar.
  const wantDetent = (v) =>
    state.sel && (v === "map" || v === "know") && detentOf[v] === "peek" ? "half" : detentOf[v];
  function goTab(v, quiet) {
    state.tab = v;
    // Katman sekmeyi izler ama yalnız iki yönde: Bildiğim'e girince "know",
    // Harita'ya girince oradaki seçim. Diller ve Ayarlar haritaya dokunmuyor —
    // dokunuyordu ve dışa aktarma Ayarlar'a geçerken katman değiştiği için
    // ekranda gördüğünün değil, ana dil haritasının resmini çekiyordu.
    if (v === "know") setLayer("know");
    else if (v === "map" && state.layer === "know") setLayer(state.mapLayer);
    render();
    setDetent(wantDetent(v), quiet);
  }
  function setTab(v) {
    if (v !== state.tab) { goTab(v); return; }
    // Aynı sekmeye ikinci dokunuş: iOS'ta "başa dön" demektir.
    if (state.sel) { select(null); return; }
    if (body.scrollTop > 4) { body.scrollTop = 0; return; }
    setDetent(detent === "peek" ? (detentOf[v] === "peek" ? "half" : detentOf[v]) : "peek");
  }
  tabs.addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]");
    if (b) setTab(b.dataset.tab);
  });
  // Ton: aile rengi aynı kalıp her dilin farklı açıklık basamağı alması.
  // Varsayılan kapalı. Kurallar .tone-on sınıfına bağlı, açıp kapamak
  // haritayı yeniden çizdirmiyor.
  let tone = localStorage.getItem("wl-tone") === "on";
  const applyTone = () => document.body.classList.toggle("tone-on", tone);

  const shareM = $("#shareM"), btnShare = $("#btnShare");
  const setShare = (on) => {
    shareM.hidden = !on;
    btnShare.setAttribute("aria-expanded", String(on));
  };
  btnShare.onclick = () => setShare(shareM.hidden);
  shareM.addEventListener("click", (e) => {
    const b = e.target.closest("[data-exp]");
    if (b) exportMap(b.dataset.exp, b);
  });
  // Haritaya ya da panele dokununca kapanır; dışa aktarma bittiğinde de.
  svg.addEventListener("pointerdown", () => setShare(false));
  sheet.addEventListener("pointerdown", () => setShare(false));

  function syncHead() {
    hLayer.hidden = state.tab !== "map";
    hKnow.hidden = state.tab !== "know";
    hSearch.hidden = state.tab !== "langs" && state.tab !== "know";
    head.hidden = state.tab === "settings";
    [["home", t().lHome], ["scr", t().lScr], ["off", t().lOff]].forEach(([k, lb]) => {
      const b = hLayer.querySelector(`[data-lay="${k}"]`);
      b.textContent = lb;
      b.setAttribute("aria-pressed", String(state.layer === k));
    });
    [["share", t().kmShare], ["home", t().kmHome]].forEach(([k, lb]) => {
      const b = hKnow.querySelector(`[data-km="${k}"]`);
      b.textContent = lb;
      b.setAttribute("aria-pressed", String(knowMode === k));
    });
  }

  function render() {
    // içerik değiştiyse panel başa sarsın; aynı içerik yenileniyorsa yerinde kalsın
    const key = state.tab + "|" + (state.sel || "") + "|" + (state.selSub || "") + "|" + state.q;
    if (key !== lastKey) { body.scrollTop = 0; lastKey = key; }
    syncTabs();
    syncHead();
    body.innerHTML =
      state.tab === "settings" ? settingsHTML()
      : state.tab === "langs" ? langsHTML()
      : state.sel ? detailHTML()
      : state.tab === "know" ? knowHTML()
      : mapHTML();
  }

  /* --------------------------------------------------------- harita sekmesi */
  const mapHTML = () => keyHTML() + scaleHTML() + `<p class="note">${t().mapHint}</p>`;

  /* ------------------------------------------------------- bildiğim sekmesi */
  const knowScale = () => `<div class="scale"><span>${t().scaleLo}</span>` +
    `<i style="background:${KNOW_ZERO}"></i>` +
    KNOW_RAMP.map((c) => `<i style="background:${c}"></i>`).join("") +
    `<span>${t().scaleHi}</span></div>`;
  function knowHTML() {
    const list = [...known].filter((k) => LG[k]);
    const ppl = ids.reduce((a, i) => a + (C[i].pop || 0) * reach(i) / 100, 0);
    const cty = knowMode === "home"
      ? ids.filter((i) => speaksHome(C[i])).length
      : ids.filter((i) => reach(i) >= 50).length;
    // Seçtiğin diller her zaman en üstte, arama süzgecinden bağımsız: bir
    // dil arayınca seçimlerin listeden düşüp ulaşılmaz olmasın.
    const rest = langIds.filter((k) => !known.has(k)).filter(matches)
      .sort((a, b) => spk(b) - spk(a) || trc(ln(LG[a]), ln(LG[b])));
    const hits = list.concat(rest);
    return `<div class="stat">
        <div><b class="num">${list.length}</b><span>${t().kStatLangs}</span></div>
        <div><b class="num">${list.length ? fmtS(ppl) : "—"}</b><span>${t().kStatPeople}</span></div>
        <div><b class="num">${cty}</b><span>${
          knowMode === "home" ? t().kStatCtyHome : t().kStatCty}</span></div>
      </div>` +
      `<p class="note">${!list.length ? t().noteKnowEmpty
        : knowMode === "home" ? t().noteHome : t().noteKnow}</p>` +
      (list.length && knowMode === "share" ? knowScale() : "") +
      `<div class="sec"><div class="sec-h"><h2>${t().pickLangs}</h2>
         <span>${t().nLangs(hits.length)}</span></div>` +
      (hits.length ? `<div class="rows">` + hits.slice(0, 160).map((s) => {
        const l = LG[s], on = known.has(s);
        return `<button class="row" data-l="${s}" aria-pressed="${on}" style="--c:${col(l.g)}">
          <span class="dot-c ${l.g === "oth" ? "oth" : ""}"></span>
          <span><span class="row-t">${esc(ln(l))}</span><br><span class="sub-t">${esc(l.e)}</span></span>
          <span class="val num">${on ? "✓" : fmtS(l.s)}</span></button>`;
      }).join("") + `</div>` : `<p class="empty">${esc(t().noHit(state.q))}</p>`) +
      `</div>`;
  }

  /* --------------------------------------------------------- ayarlar sekmesi */
  const segHTML = (attr, opts, cur, dis) => `<div class="seg" role="group">` +
    opts.map(([v, lb]) => `<button data-${attr}="${v}" aria-pressed="${String(cur === v)}"${
      dis ? " disabled" : ""}>${esc(lb)}</button>`).join("") + `</div>`;
  const grpHTML = (title, inner, note) =>
    `<div class="grp"><h3>${esc(title)}</h3>${inner}${
      note ? `<p class="pop-n">${esc(note)}</p>` : ""}</div>`;
  function settingsHTML() {
    return grpHTML(t().paint,
        segHTML("paint", [["fam", t().pFam], ["pct", t().pPct], ["ppl", t().pPpl]],
                state.paint, state.layer !== "home") + scaleHTML(),
        state.layer !== "home" ? t().paintOnlyHome : "") +
      grpHTML(t().detail,
        segHTML("lod", [["auto", t().dAuto], ["off", t().dOff], ["on", t().dOn]], state.lod),
        t().lodNote) +
      grpHTML(t().theme,
        segHTML("theme", [["auto", t().tAuto], ["light", t().tLight], ["dark", t().tDark]], theme)) +
      grpHTML(t().mTone,
        segHTML("tone", [["off", t().toneOff], ["on", t().toneOn]], tone ? "on" : "off"),
        t().toneNote) +
      grpHTML(t().uiLang, segHTML("ui", [["tr", "Türkçe"], ["en", "English"]], ui)) +
      `<p class="pop-n" style="margin-top:22px">${esc(t().credit)}</p>`;
  }

  /* ----------------------------------------------------------- dil dizini */
  function langsHTML() {
    const q = norm(state.q);
    let html = "";
    if (state.q) {
      const cs = ids.filter((i) => norm(C[i].n).includes(q) || norm(C[i].en).includes(q))
        .sort((a, b) => trc(cn(C[a]), cn(C[b]))).slice(0, 8);
      if (cs.length) {
        html += `<div class="sec"><div class="sec-h"><h2>${t().countries}</h2></div><div class="rows">` +
          cs.map((i) => {
            const l = LG[C[i].l];
            return `<button class="row" data-go="${i}" style="--c:${col(l.g)}">
              <span class="dot-c ${l.g === "oth" ? "oth" : ""}"></span>
              <span><span class="row-t">${esc(cn(C[i]))}</span><br><span class="sub-t">${esc(ln(l))}</span></span>
              <span class="val num">${pc(C[i].p)}</span></button>`;
          }).join("") + `</div></div>`;
      }
    }
    const hits = langIds.filter(matches).sort((a, b) =>
      state.sort === "spk" ? spk(b) - spk(a) || trc(ln(LG[a]), ln(LG[b]))
                           : total(b) - total(a) || trc(ln(LG[a]), ln(LG[b])));
    html += `<div class="sec"><div class="sec-h"><h2>${t().languages}</h2>
        <span>${t().nLangs(hits.length)}</span></div>
      <div class="seg" role="group" aria-label="${t().lblSort}" style="margin-bottom:8px">
        <button data-sort="spk" aria-pressed="${state.sort === "spk"}">${t().bySpk}</button>
        <button data-sort="cnt" aria-pressed="${state.sort === "cnt"}">${t().byCnt}</button>
      </div>`;
    html += hits.length ? `<div class="rows">` + hits.slice(0, 160).map((s) => {
      const l = LG[s], on = state.filter && state.filter.t === "l" && state.filter.k === s;
      return `<button class="row" data-l="${s}" aria-pressed="${on}" style="--c:${col(l.g)}">
        <span class="dot-c ${l.g === "oth" ? "oth" : ""}"></span>
        <span><span class="row-t">${esc(ln(l))}</span><br><span class="sub-t">${esc(l.e)}</span></span>
        <span class="val num">${state.sort === "spk" ? fmtK(l.s) : (total(s) ? t().cnt(total(s)) : "—")}</span>
      </button>`;
    }).join("") + `</div>` : `<p class="empty">${esc(t().noHit(state.q))}</p>`;
    return html + `</div>`;
  }
  /* ----------------------------------------------------------- katmanlar */
  // Renk anahtarı artık Harita sekmesinin panelinde: yüzen menüde yer yoktu,
  // o yüzden ana dil katmanında hiç gösterilmiyordu. Panelde yer var.
  const keyOrder = () => state.layer === "scr" ? SGORDER : GORDER;
  const keyName = (g) => state.layer === "scr"
    ? (ui === "en" ? SGR[g].ne : SGR[g].n) : (ui === "en" ? GR[g].ne : GR[g].n);
  const keyCol = (g) => col(state.layer === "scr" ? SGCOL[g] : g);
  const keyIsOth = (g) => (state.layer === "scr" ? SGCOL[g] : g) === "oth";
  function keyHTML() {
    const n = {};
    ids.forEach((i) => { const k = keyOf(C[i], i); n[k] = (n[k] || 0) + 1; });
    return `<div class="popkey">` + keyOrder().filter((g) => n[g]).map((g) =>
      `<span class="popkey-row" style="--c:${keyCol(g)}">
         <i class="${keyIsOth(g) ? "oth" : ""}"></i>${esc(keyName(g))}
         <b class="num">${n[g]}</b></span>`).join("") + `</div>` +
      `<p class="pop-n">${state.layer === "scr" ? t().noteScr
        : state.layer === "off" ? t().noteOff : t().noteHomeKey}</p>`;
  }
  function reclass(n, o, cid) {
    n.classList.remove("crl", "mism");
    GORDER.forEach((g) => n.classList.remove("g-" + g));
    gcls(o, cid).split(" ").forEach((c) => n.classList.add(c));
  }
  function applyLayer() {
    svg.querySelectorAll(".cty, .dot, .sbase").forEach((n) =>
      reclass(n, C[n.dataset.id], n.dataset.id));
    svg.querySelectorAll(".sub").forEach((n) => {
      const s = SB[n.dataset.sid];
      if (s) reclass(n, s, s.p);
    });
  }
  function toggleKnown(slug) {
    if (known.has(slug)) known.delete(slug); else known.add(slug);
    localStorage.setItem("wl-known", [...known].join(","));
    rampKey = ""; repaint(); render(); queueHash();
  }

  // Dışa aktarma: o anki görünümü tek başına duran bir SVG'ye çevirip
  // indiriyor; PNG için aynı SVG iki kat ölçekte tuvale çiziliyor.
  const MAP_SEL = /^(svg|#map|\.cty|\.sub|\.sbase|\.dot|\.outer|\.inner|\.g-|\.crl|\.mism|\.sphere|\.graticule|\.orn|\.map-label|\.hitdot|\.sel|\.hit)/;
  function mapCSS() {
    const cs = getComputedStyle(document.documentElement);
    const vars = ["--ocean", "--land", "--border", "--sub-line", "--ink", "--ink-2",
                  "--ink-3", "--hatch", "--grat", "--c-min"].concat(GORDER.map((g) => "--g-" + g));
    const out = [":root{" + vars.map((v) => `${v}:${cs.getPropertyValue(v).trim()}`).join(";") + "}"];
    for (const sheet of document.styleSheets) {
      let rules; try { rules = sheet.cssRules; } catch (_) { continue; }
      for (const r of rules) {
        if (!r.selectorText || !r.style) continue;
        if (r.selectorText.split(",").some((x) => MAP_SEL.test(x.trim()))) out.push(r.cssText);
      }
    }
    return out.join("\n");
  }
  function exportSVG() {
    const clone = svg.cloneNode(true);
    clone.querySelectorAll(".off").forEach((n) => n.remove());
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("width", Math.round(vb.w));
    clone.setAttribute("height", Math.round(vb.h));
    const st = document.createElementNS("http://www.w3.org/2000/svg", "style");
    st.textContent = mapCSS();
    clone.insertBefore(st, clone.firstChild);
    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("x", vb.x); bg.setAttribute("y", vb.y);
    bg.setAttribute("width", vb.w); bg.setAttribute("height", vb.h);
    bg.setAttribute("fill", getComputedStyle(document.documentElement)
      .getPropertyValue("--ocean").trim() || "#0b0e13");
    clone.insertBefore(bg, st.nextSibling);
    return '<?xml version="1.0" encoding="UTF-8"?>\n' +
      new XMLSerializer().serializeToString(clone);
  }
  // Android WebView'de <a download> hiçbir şey yapmıyor: indirme işleyicisi
  // yok, tıklama sessizce yutuluyor. Sayfa "İndirildi" yazıyor ama dosya ne
  // İndirilenler'e ne galeriye düşüyordu. Kabuk köprü sunuyorsa baytları ona
  // veriyoruz; tarayıcıda eski yol geçerli.
  const bridge = (() => {
    try { if (window.AtlasSave && window.AtlasSave.save) return "android"; } catch (e) {}
    try {
      if (window.webkit && window.webkit.messageHandlers
          && window.webkit.messageHandlers.atlasSave) return "mac";
    } catch (e) {}
    return null;
  })();
  // Uygulama kabuğunun içindeyiz ama köprü yok: <a download> burada hiçbir şey
  // yapmaz, "İndirildi" yazmak yalan olur.
  const shellNoBridge = !bridge && (() => {
    try {
      if (window.webkit && window.webkit.messageHandlers) return true;
      if (/;\s*wv\)/.test(navigator.userAgent)) return true;
    } catch (e) {}
    return false;
  })();
  // btoa tek seferde büyük diziyi kaldırmıyor: 32 KB'lık parçalara bölünüyor.
  function toB64(u8) {
    let out = "";
    for (let i = 0; i < u8.length; i += 0x8000) {
      out += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    }
    return btoa(out);
  }
  // Kabuk sonucu geri bildirir; gelmezse buton sonsuza kadar beklemesin.
  // Dosya, bildirimden önce yazılıyor: bildirim yolu bozuksa bile kaydedilmiş
  // olur, o yüzden zaman aşımında başarı varsayılıyor.
  let macPending = null, macTimer = 0;
  window.__atlasSaved = (ok) => {
    clearTimeout(macTimer);
    const f = macPending; macPending = null;
    if (f) f(!!ok);
  };
  const waitAck = (done) => {
    macPending = done;
    clearTimeout(macTimer);
    macTimer = setTimeout(() => { const f = macPending; macPending = null; if (f) f(true); }, 2500);
  };
  // done(ok) her yolda tam bir kez çağrılır; buton yazısı gerçeği söylesin.
  function saveBlob(blob, name, done) {
    if (shellNoBridge) { done(false, true); return; }
    if (!bridge) {
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 8000);
        done(true);
      } catch (e) { done(false); }
      return;
    }
    blob.arrayBuffer().then((buf) => {
      const b64 = toB64(new Uint8Array(buf));
      const mime = blob.type || "application/octet-stream";
      if (bridge === "android") { done(!!window.AtlasSave.save(name, mime, b64)); return; }
      waitAck(done);
      window.webkit.messageHandlers.atlasSave.postMessage({ name: name, b64: b64 });
    }, () => done(false));
  }
  // PNG çözünürlüğü görüş kutusunun *harita birimlerine* bağlıydı (vb.w × 2):
  // yakınlaştıkça kutu küçüldüğü için çıktı da küçülüyordu — telefonda
  // 387×837 gibi. Artık uzun kenar piksel olarak hedefleniyor, ölçek ondan
  // türetiliyor; Chromium SVG'yi hedef boyutta yeniden rasterize ettiği için
  // sonuç gerçekten keskin, büyütülmüş bir bitmap değil. Tavanlar tuval
  // sınırı ve WebView belleği için.
  const PNG_LONG = 2800, PNG_MAXDIM = 4096, PNG_MAXPX = 9e6;
  function pngScale(w, h) {
    const long = Math.max(w, h);
    return Math.max(2, Math.min(PNG_LONG / long, PNG_MAXDIM / long,
                                Math.sqrt(PNG_MAXPX / (w * h))));
  }
  function exportMap(kind, btn) {
    const label = btn.textContent;
    const done = (ok, noShell) => {
      btn.textContent = ok ? (bridge ? t().savedTo : t().saved)
                           : noShell ? t().saveNoShell : t().saveFail;
      setTimeout(() => { btn.textContent = label; }, 1800);
    };
    let svgText;
    try { svgText = exportSVG(); } catch (e) { done(false); return; }
    if (kind === "svg") {
      try { saveBlob(new Blob([svgText], { type: "image/svg+xml" }), "dunya-dilleri.svg", done); }
      catch (e) { done(false); }
      return;
    }
    const url = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml" }));
    const img = new Image();
    img.onload = () => {
      const k = pngScale(vb.w, vb.h);
      const cv = document.createElement("canvas");
      cv.width = Math.round(vb.w * k); cv.height = Math.round(vb.h * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob((bl) => {
        URL.revokeObjectURL(url);
        if (!bl) { done(false); return; }
        saveBlob(bl, "dunya-dilleri.png", done);
      }, "image/png");
    };
    img.onerror = () => { URL.revokeObjectURL(url); done(false); };
    img.src = url;
  }

  function setLayer(v) {
    if (v === state.layer) return;
    state.layer = v;
    // Yoğunluk ve kişi boyaması evdeki dilin payını anlatıyor; öbür
    // katmanlarda karşılığı yok.
    if (v !== "home" && state.paint !== "fam") state.paint = "fam";
    rampKey = "";
    applyLayer();
    // Gösterge anahtarları katmanlar arasında ortak değil.
    setFilter(state.filter && state.filter.t === "g" ? null : state.filter);
    render();
    queueHash();
  }

  function scaleHTML() {
    if (state.paint === "fam") return "";
    const lab = state.paint === "pct" ? [t().scaleLo, t().scaleHi] : [t().scaleLoP, t().scaleHiP];
    return `<div class="scale"><span>${lab[0]}</span>` +
      ramp.map((c) => `<i style="background:${c}"></i>`).join("") + `<span>${lab[1]}</span></div>`;
  }

  // Devletin dili: hukuken resmî diller, yoksa fiilî olan
  const offSection = (cid) => {
    const o = C[cid], list = (o && o.o) || [];
    if (!list.length) return "";
    return `<div class="sec"><div class="sec-h"><h2>${o.oj ? t().official : t().officialDe}</h2></div>` +
      `<div class="chips">` + list.map((s) => {
        const g = LG[s] ? LG[s].g : "oth";
        return `<button class="chip" data-offl="${s}" style="--c:${col(g)}">${
          esc(LG[s] ? ln(LG[s]) : s)}</button>`;
      }).join("") + `</div>` +
      (o.od ? `<p class="note">${t().officialDe}: ` +
        o.od.map((s) => esc(LG[s] ? ln(LG[s]) : s)).join(", ") + `</p>` : "") +
      (o.oj ? "" : `<p class="note">${t().offNoneChip}</p>`) +
      (o.om ? `<p class="note">${t().offMismatch}</p>` : "") +
      (offNote(o) ? `<p class="note">${esc(offNote(o))}</p>` : "") +
      `</div>`;
  };

  const bars = (list, pop, hue, cap) => {
    const show = cap ? list.slice(0, cap) : list, rest = list.length - show.length;
    return `<div class="bars">` + show.map(([n, p]) =>
      `<div class="bar" style="--c:${hue}">
         <span class="bar-n">${esc(tx(n))}</span>
         <span class="bar-v num">${pc(p)}${pop ? " · " + fmtK(pop * p / 100) : ""}</span>
         <span class="bar-t"><i style="width:${Math.min(100, p)}%"></i></span>
       </div>`).join("") + `</div>` +
      (rest ? `<p class="note">${esc(t().more(rest))}</p>` : "");
  };

  function detailHTML() {
    const sub = state.selSub ? SB[state.selSub] : null;
    const id = state.sel;
    const c = sub
      ? { n: sn(sub), r: cn(C[sub.p]) + " · " + t().region, l: sub.l, p: sub.mix[0][1],
          pop: sub.pop, mix: sub.mix, l2: C[sub.p].l2, l2c: !!C[sub.p].l2, sub: true }
      : { n: cn(C[id]), r: (ui === "en" ? C[id].re : C[id].r) + (C[id].t ? " · " + t().dep : ""),
          l: C[id].l, p: C[id].p, pop: C[id].pop, mix: C[id].mix, l2: C[id].l2,
          note: noteOf(C[id]), m: C[id].m };
    const l = LG[c.l] || LG[C[id].l];
    const minor = LG[c.l] ? (LG[c.l].in || []).filter(([i]) => C[i].l !== c.l) : [];
    // Bildiğim sekmesinde büyük rakamlar senin dillerini anlatıyor, ülkenin
    // ana dilini değil: sekmenin sorusu o. Eskiden tam tersiydi — Bulgaristan'a
    // bakarken en büyük yazı "%85 Bulgarca" oluyor, aradığın "%34 ile
    // anlaşabilirsiniz" küçük bir dipnotta kalıyordu.
    const reachFirst = state.tab === "know" && known.size && knowMode === "share";
    const homeBlock =
      `<p class="d-lang" style="--c:${col(l.g)}"><i class="${
        l.g === "oth" ? "oth" : ""}"></i>${esc(ln(l))}</p>` +
      `<p class="d-fam">${esc(lf(l))}</p>` +
      `<p class="d-fam">${t().script} · ${esc(scName(l.sc))}${
        l.sc2 ? " + " + esc(scName(l.sc2)) : ""}</p>` +
      (l.sc2 ? `<p class="note">${esc(sc2Note(l))}</p>` : "");
    const homeFigs =
      `<div class="stat">
         <div><b class="num">${pc(c.p)}</b><span>${t().speaks}</span></div>
         <div><b class="num">${c.pop ? fmtK(c.pop * c.p / 100) : "—"}</b><span>${t().people}</span></div>
         <div><b class="num">${c.pop ? fmtK(c.pop) : "—"}</b><span>${t().pop}</span></div>
       </div>`;
    // Kartın en üstünde, katmanın sorduğu soruya cevap veren şey durur.
    // Yazı katmanında yazı, resmî dil katmanında devletin dili, Bildiğim'de
    // senin payın. Üçünde de eskiden ana dilin payı en büyük yazıydı ve
    // aradığın bilgi küçük bir satıra düşüyordu.
    const scrLead = () => {
      const g = SCR[l.sc] && SCR[l.sc].g;
      return `<p class="d-lang" style="--c:${col(g ? SGCOL[g] : "oth")}"><i></i>${
          esc(scName(l.sc))}${l.sc2 ? " + " + esc(scName(l.sc2)) : ""}</p>` +
        `<p class="d-fam">${esc(ln(l))} · ${esc(lf(l))}</p>` +
        (l.sc2 ? `<p class="note">${esc(sc2Note(l))}</p>` : "") +
        `<p class="note">${t().noteScr}</p>`;
    };
    const offLead = () => {
      const o = C[id], list = (o && o.o) || [];
      if (!list.length) return homeBlock;
      const g = LG[list[0]] ? LG[list[0]].g : "oth";
      return `<p class="d-lang" style="--c:${col(g)}"><i class="${
          g === "oth" ? "oth" : ""}"></i>${list.map((k) =>
          esc(LG[k] ? ln(LG[k]) : k)).join(" · ")}</p>` +
        `<p class="d-fam">${o.oj ? t().official : t().officialDe}</p>` +
        (o.od ? `<p class="note">${t().officialDe}: ` +
          o.od.map((k) => esc(LG[k] ? ln(LG[k]) : k)).join(", ") + `</p>` : "") +
        (o.oj ? "" : `<p class="note">${t().offNoneChip}</p>`) +
        (o.om ? `<p class="note">${t().offMismatch}</p>` : "") +
        (offNote(o) ? `<p class="note">${esc(offNote(o))}</p>` : "");
    };
    const sec = (h, inner) =>
      `<div class="sec"><div class="sec-h"><h2>${h}</h2></div>${inner}</div>`;
    const scrFirst = !reachFirst && state.layer === "scr";
    const offFirst = !reachFirst && state.layer === "off" && ((C[id] && C[id].o) || []).length;
    return (
      `<div class="d-top"><div class="grow" style="flex:1;min-width:0">
         <h2>${esc(c.n)}</h2><p>${esc(c.r)}</p></div></div>` +
      (reachFirst
        ? reachFigs(id, c) + reachLangs(id, c) +
          sec(t().kHomeLang, homeBlock + homeFigs)
        : scrFirst ? scrLead() + homeFigs
        : offFirst ? offLead() + sec(t().kHomeLang, homeBlock + homeFigs)
        : homeBlock + homeFigs) +
      homeGap(c) +
      (reachFirst ? "" : knowLine(id, c)) +
      (c.m === 0 ? `<p class="note">${t().noMajority}</p>` : "") +
      (c.note ? `<p class="note">${esc(c.note)}</p>` : "") +
      (offFirst ? "" : offSection(id)) +
      (c.mix ? `<div class="sec"><div class="sec-h"><h2>${t().home}</h2></div>
         ${bars(c.mix, c.pop, col(l.g), 12)}
         <p class="note">${t().homeNote}</p></div>` : "") +
      (c.l2 ? `<div class="sec"><div class="sec-h"><h2>${t().l2}</h2></div>
         ${bars(c.l2, c.pop, "var(--ink-3)", 8)}
         <p class="note">${t().l2Note}${c.l2c ? t().l2Country(esc(cn(C[state.sel]))) : ""}</p></div>` : "") +
      (minor.length ? `<div class="sec"><div class="sec-h"><h2>${esc(t().elsewhere(ln(l)))}</h2>
           <span>${t().minor(minor.length)}</span></div>
         <div class="chips">` + minor.slice(0, 14).map((m) =>
           `<button class="chip" data-go="${m[0]}">${esc(cn(C[m[0]]))} <b class="num">${pc(m[1])}</b></button>`).join("") +
         `</div></div>` : "") +
      `<div class="acts">` +
        (sub ? `<button class="ghost" data-up="${id}">${esc(t().back(cn(C[id])))}</button>` : "") +
        (!sub && subsOf[id] ? `<button class="ghost" data-sub="${id}">${esc(t().showSubs(c.n))}</button>` : "") +
        `<button data-l="${c.l}">${esc(t().showLang(ln(l)))}</button>` +
        `<button class="ghost" data-close="1">${t().close}</button>` +
      `</div>`);
  }

  /* ------------------------------------------------- panel başlığı denetimi */
  // Katman ve okuma biçimi seçicileri panelin başlığında duruyor; ikisi de
  // aynı ele bağlı, çünkü ikisi de "harita neyi anlatıyor" sorusunu yanıtlıyor.
  head.addEventListener("click", (e) => {
    const b = e.target.closest("[data-lay],[data-km]");
    if (!b) return;
    if (b.dataset.lay) { state.mapLayer = b.dataset.lay; setLayer(b.dataset.lay); return; }
    knowMode = b.dataset.km;
    localStorage.setItem("wl-knowmode", knowMode);
    rampKey = ""; repaint(); setFilter(state.filter); render(); queueHash();
  });

  /* --------------------------------------------------------- tema ve dil */
  let theme = localStorage.getItem("wl-theme") || "auto";
  function setTheme(v) {
    theme = v;
    localStorage.setItem("wl-theme", v);
    if (v === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", v);
    rampKey = ""; repaint();
  }
  // Erişilebilirlik etiketleri de dile bağlı; bunlar yalnız açılıştaki Türkçe
  // iskeletten geliyordu.
  function applyLabels() {
    const lbl = (sel, v) => { const e = $(sel); if (e) e.setAttribute("aria-label", v); };
    lbl("#map", t().lblMap); lbl("#btnClear", t().lblClear);
    lbl("#btnIn", t().lblIn); lbl("#btnOut", t().lblOut); lbl("#btnFit", t().lblFit);
    lbl("#btnShare", t().exportT); lbl("#shareM", t().exportT);
    lbl("#q", t().search); lbl("#qClear", t().lblClearQ);
    lbl("#hLayer", t().layerT); lbl("#hKnow", t().lblMode);
    lbl("#tabs", t().lblTabs);
  }
  function setUi(v) {
    ui = v;
    queueHash();
    localStorage.setItem("wl-ui", v);
    document.documentElement.lang = v;
    $("#q").placeholder = t().search;
    applyLabels();
    setFilter(state.filter);          // başlık ve liste yeniden yazılır
    // Harita üzerindeki seçim etiketi de yeniden çizilsin: dili değiştirince
    // kart İngilizceye geçiyor ama haritada "Bulgaristan" yazmaya devam
    // ediyordu.
    if (state.sel) select(state.sel, state.selSub);
    render();
  }

  /* ---------------------------------------------------------- eylemler */
  body.addEventListener("click", (e) => {
    const el = e.target.closest("[data-go],[data-l],[data-offl],[data-sort],[data-up],[data-sub]," +
      "[data-close],[data-unknow],[data-paint],[data-lod],[data-theme],[data-ui],[data-exp],[data-tone]");
    if (!el) return;
    const d = el.dataset;
    // ayarlar sekmesi
    if (d.exp) { exportMap(d.exp, el); return; }
    if (d.paint) { state.paint = d.paint; rampKey = ""; repaint(); render(); queueHash(); return; }
    if (d.lod) { state.lod = d.lod; applyLod(); render(); queueHash(); return; }
    if (d.theme) { setTheme(d.theme); render(); return; }
    if (d.tone) {
      tone = d.tone === "on";
      localStorage.setItem("wl-tone", tone ? "on" : "off");
      applyTone(); render(); queueHash(); return;
    }
    if (d.ui) { setUi(d.ui); return; }
    if (d.unknow) { toggleKnown(d.unknow); return; }
    // gezinme
    if (d.go) { select(d.go); focusCountry(d.go); return; }
    // resmî dil rozeti: o dilin resmî olduğu ülkeleri süz
    if (d.offl) { goTab("map"); state.mapLayer = "off"; setLayer("off");
                  setFilter({ t: "l", k: d.offl }); return; }
    if (d.sort) { state.sort = d.sort; render(); return; }
    if (d.up) { select(d.up); focusCountry(d.up); return; }
    if (d.sub) { state.lod = "on"; applyLod(); focusCountry(d.sub); return; }
    if (d.close) { select(null); return; }
    if (d.l) {
      if (state.tab === "know") { toggleKnown(d.l); return; }
      const same = state.filter && state.filter.t === "l" && state.filter.k === d.l;
      setFilter(same ? null : { t: "l", k: d.l });
      if (!same) { goTab("map"); setDetent("peek"); }
    }
  });

  /* ------------------------------------------------------------ süzgeç */
  function setFilter(f) {
    state.filter = f;
    queueHash();
    markMap();
    rampKey = ""; repaint();
    $("#btnClear").hidden = !f;
    if (!f) {
      $("#capT").textContent = t().title;
      $("#capS").textContent = capSub();
    } else if (f.t === "l") {
      const l = LG[f.k];
      $("#capT").textContent = ln(l);
      $("#capS").textContent = (l.c + l.t ? t().majIn(l.c + l.t) : t().majNone) +
        " · " + t().native(fmtK(l.s));
    }
    if (!state.sel) render();
    live(f ? $("#capT").textContent : t().filterOff);
  }
  $("#btnClear").onclick = () => { setFilter(null); select(null); };

  /* ------------------------------------------------------------- seçim */
  function select(id, sid) {
    state.sel = id || null; state.selSub = sid || null;
    queueHash();
    svg.querySelectorAll(".sel").forEach((n) => n.classList.remove("sel"));
    marks.innerHTML = "";
    if (!id) { render(); return; }
    if (sid) { const n = subNode(sid); if (n) n.classList.add("sel"); }
    else nodesOf(id).forEach((n) => n.classList.add("sel"));
    const o = sid ? SB[sid] : C[id], u = unit();
    // Kaydırma yalnız iğne varken gerekiyor; iğnesiz büyük ülkelerde ad
    // çapanın üstüne kayıp ortada durmuyordu.
    const pin = (o.a || 0) < 6;
    if (pin) {
      marks.innerHTML = `<circle class="pin" cx="${o.c[0]}" cy="${o.c[1]}" r="${(8 * u).toFixed(2)}"></circle>`;
    }
    marks.insertAdjacentHTML("beforeend",
      `<text class="map-label" x="${o.c[0]}" y="${o.c[1] - (pin ? 12 * u : 0)}" text-anchor="middle"
        ${pin ? "" : 'dominant-baseline="central"'}
        font-size="${(14 * u).toFixed(2)}">${esc(sid ? sn(o) : cn(o))}</text>`);
    // Yer kartının yeri Harita ve Bildiğim sekmeleri; listeden ya da ayarlardan
    // bir yer seçilince oraya götürür. Sekme bir varış noktası: seçim onu izler.
    if (state.tab !== "map" && state.tab !== "know") { goTab("map"); return; }
    render();
    if (detent === "peek") setDetent("half");
  }
  function focusCountry(id) {
    const c = C[id];
    zoomTo(c.c[0], c.c[1], Math.max(W / 9, Math.min(W, Math.sqrt(Math.max(c.a, 6)) * 22)));
  }
  function live(t) { $("#live").textContent = t; }

  /* ------------------------------------------------------------- arama */
  const q = $("#q"), qClear = $("#qClear");
  q.addEventListener("input", () => {
    state.q = q.value.trim(); qClear.hidden = !state.q;
    if (state.sel) { state.sel = null; state.selSub = null; }
    render();
  });
  q.addEventListener("focus", () => { if (detent !== "full") setDetent("full"); });
  q.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault(); q.blur();
    const hit = ids.find((i) => state.q && norm(C[i].n).includes(norm(state.q)));
    if (hit) { select(hit); focusCountry(hit); setDetent("half"); }
  });
  qClear.onclick = () => { q.value = ""; state.q = ""; qClear.hidden = true; render(); q.focus(); };

  /* --------------------------------------------------------------- git */
  // Sekme çubuğunun gerçek yüksekliği (güvenli alan payı dahil) panelin
  // dibini belirliyor; CSS'e ölçerek yazılıyor, tahmin edilmiyor.
  const measureTabs = () =>
    document.documentElement.style.setProperty("--tabh", tabs.offsetHeight + "px");
  addEventListener("resize", () => { measureTabs(); applyVB(); setDetent(detent, true); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    rampKey = ""; repaint(); render();
  });
  if (theme !== "auto") document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.lang = ui;
  $("#q").placeholder = t().search;
  $("#capT").textContent = t().title;
  $("#capS").textContent = capSub();
  buildRamp("--g-ger");
  applyTone();
  applyLabels();
  measureTabs();
  render();
  setDetent(detentOf[state.tab], true);
  homeView();

  /* --------------------------------------------------- linkten gelen durum */
  function applyHash(h) {
    if (!h) return;
    hashLock = true;
    try {
      if (T[h.l] && h.l !== ui) setUi(h.l);
      if (h.kn) {
        known.clear();
        h.kn.split(".").filter((k) => LG[k]).forEach((k) => known.add(k));
        localStorage.setItem("wl-known", [...known].join(","));
      }
      // bağlantı görünümü belirler: km yoksa varsayılan kip
      knowMode = h.km === "home" ? "home" : "share";
      localStorage.setItem("wl-knowmode", knowMode);
      if (h.tone === "1" && !tone) { tone = true; applyTone(); }
      if (["home", "scr", "off", "know"].includes(h.k)) setLayer(h.k);
      if (["fam", "pct", "ppl"].includes(h.p)) { state.paint = h.p; rampKey = ""; repaint(); }
      if (["auto", "off", "on"].includes(h.d)) { state.lod = h.d; applyLod(); }
      if (h.f) {
        const [tp, ...rest] = h.f.split(".");
        const k = rest.join(".");
        if (tp === "l" && LG[k]) setFilter({ t: "l", k });
      }
      if (h.v) {
        const [x, y, w] = h.v.split(",").map(Number);
        if ([x, y, w].every(Number.isFinite) && w > 0) {
          vb.w = w; vb.h = w * aspect(); vb.x = x; vb.y = y; commitVB();
        }
      }
      // Seçim görüş kutusundan sonra: bölge seçimi ayrıntı düzeyini açtırıyor.
      if (h.u && SB[h.u]) { state.lod = "on"; applyLod(); select(SB[h.u].p, h.u); }
      else if (h.s && C[h.s]) select(h.s);
      // Bağlantı katmanı belirliyorsa sekme de onu izlesin.
      if (state.layer !== "know") state.mapLayer = state.layer;
      goTab(state.layer === "know" ? "know" : "map", true);
    } finally {
      hashLock = false;
    }
  }
  addEventListener("hashchange", () => { applyHash(parseHash()); });
  applyHash(H0);

  // Kaba geometri ilk kareden sonra hesaplanıyor: açılışı geciktirmesin.
  setTimeout(() => { buildGeo(); applyGeoLod(); }, 0);
})();
</script>
