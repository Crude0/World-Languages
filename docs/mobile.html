<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Dünya Dilleri</title><meta name="color-scheme" content="light dark"><style>*,*::before,*::after{box-sizing:border-box}</style></head><body><style>
/* ============================================================ temel ===== */
:root {
  /* İki temayı da desteklediğimizi bildirmezsek Android WebView sayfayı kendi
     algoritmasıyla karartıyor ve açık temada bazı yüzeyler koyu kalıyor. */
  color-scheme: light dark;
  --bg:        #eef1f4;
  --ocean:     #e3e8ec;
  --land-mute: #ccd1d7;
  --ink:       #171a20;
  --ink-2:     #454c57;
  --ink-3:     #6b7480;
  --rule:      rgba(23,26,32,.10);
  --sheet:     #ffffff;
  --glass:     rgba(252,253,254,.62);
  --glass-2:   rgba(252,253,254,.82);
  --edge:      rgba(255,255,255,.55);
  --shade:     rgba(16,20,28,.16);
  --tint:      #1f6feb;
  --hatch:     rgba(23,26,32,.34);
  /* Sınır hiyerarşisi: ülke sınırı koyu ve kalın, il/eyalet sınırı beyaz ve
     ince. İki tema arasında anlam sabit — koyu çizgi her zaman ülke. */
  --border:   rgba(10,12,16,.62);
  --sub-line: rgba(255,255,255,.70);
  --g-rom: #ea231a; --g-ger: #0080ea; --g-ine: #7529ce; --g-trk: #d88c04;
  --g-afa: #06830f; --g-nkg: #15bb77; --g-asi: #a40062; --g-aus: #db3bb6;
  --g-oth: #8d949e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0d1014;
    --ocean:     #12151b;
    --land-mute: #272b33;
    --ink:       #eceef2;
    --ink-2:     #b3bac4;
    --ink-3:     #838d99;
    --rule:      rgba(236,238,242,.12);
    --sheet:     #191d24;
    --glass:     rgba(28,32,40,.62);
    --glass-2:   rgba(28,32,40,.84);
    --edge:      rgba(255,255,255,.10);
    --shade:     rgba(0,0,0,.45);
    --tint:      #62a8ff;
    --hatch:     rgba(236,238,242,.30);
    --border:   rgba(0,0,0,.66);
    --sub-line: rgba(255,255,255,.58);
    --g-rom: #db0002; --g-ger: #119efd; --g-ine: #6354f5; --g-trk: #c7810a;
    --g-afa: #81c90d; --g-nkg: #009a73; --g-asi: #ff4b9d; --g-aus: #b529b8;
    --g-oth: #99a1ac;
  }
}
:root[data-theme="dark"] {
  --bg:        #0d1014;
  --ocean:     #12151b;
  --land-mute: #272b33;
  --ink:       #eceef2;
  --ink-2:     #b3bac4;
  --ink-3:     #838d99;
  --rule:      rgba(236,238,242,.12);
  --sheet:     #191d24;
  --glass:     rgba(28,32,40,.62);
  --glass-2:   rgba(28,32,40,.84);
  --edge:      rgba(255,255,255,.10);
  --shade:     rgba(0,0,0,.45);
  --tint:      #62a8ff;
  --hatch:     rgba(236,238,242,.30);
  --border:   rgba(0,0,0,.66);
  --sub-line: rgba(255,255,255,.58);
  --g-rom: #db0002; --g-ger: #119efd; --g-ine: #6354f5; --g-trk: #c7810a;
  --g-afa: #81c90d; --g-nkg: #009a73; --g-asi: #ff4b9d; --g-aus: #b529b8;
  --g-oth: #99a1ac;
}

* { -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Cam yüzey: arkasını bulanıklaştırıp doygunlaştırır, üst kenarında ince bir
   parlama bırakır. Katmanlar birbirinin üstünde durduğunda derinlik hissi
   veren şey bu ince kenar + yumuşak gölge. */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(135%);
  backdrop-filter: blur(20px) saturate(135%);
  border: .5px solid var(--edge);
  box-shadow: 0 8px 30px var(--shade), inset 0 .5px 0 rgba(255,255,255,.30);
}
body.busy #map { shape-rendering: optimizeSpeed; }
body.busy .sheet { transition: none; }

/* ============================================================ harita ==== */
#stage { position: fixed; inset: 0; background: var(--ocean); }
#map { display: block; width: 100%; height: 100%; touch-action: none; }
.sphere { fill: var(--ocean); }

/* kenar süslemeleri */
.orn { color: var(--ink-3); opacity: .44; pointer-events: none; transition: opacity .3s ease; }
body.zoomed .orn { opacity: 0; }
.orn use { stroke: currentColor; stroke-width: .85; stroke-linejoin: round; stroke-linecap: round; }
.orn-t {
  fill: currentColor; font-size: 13px; letter-spacing: .34em; font-weight: 500;
  opacity: .8; text-transform: uppercase;
}
@media (prefers-reduced-motion: no-preference) {
  .orn .bob  { animation: bob 7s ease-in-out infinite; }
  .orn .bob2 { animation: bob 9s ease-in-out infinite reverse; }
}
@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50%      { transform: translateY(-1.6px) rotate(.6deg); }
}
.graticule path { fill: none; stroke: var(--rule); stroke-width: .6; vector-effect: non-scaling-stroke; }
/* Ülke sınırı: koyu ve belirgin. Kıyıda okyanusa karışır (siluet bozulmaz),
   iki ülke arasında ise net bir ayrım çizgisi olur. */
.cty { stroke: var(--border); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.dot { stroke: var(--ocean); stroke-width: 1; vector-effect: non-scaling-stroke; }
.g-rom { fill: var(--g-rom); } .g-ger { fill: var(--g-ger); } .g-ine { fill: var(--g-ine); }
.g-afa { fill: var(--g-afa); } .g-nkg { fill: var(--g-nkg); } .g-aus { fill: var(--g-aus); }
.g-trk { fill: var(--g-trk); } .g-asi { fill: var(--g-asi); }
.g-oth { fill: url(#hatch); }
/* Kreoller kendi rengini almaz: kaynak dilin renginin taramalı hâliyle çizilir. */
.crl.g-rom { fill: url(#hx-rom); } .crl.g-ger { fill: url(#hx-ger); }
.crl.g-ine { fill: url(#hx-ine); } .crl.g-afa { fill: url(#hx-afa); }
.crl.g-nkg { fill: url(#hx-nkg); } .crl.g-aus { fill: url(#hx-aus); }
.crl.g-trk { fill: url(#hx-trk); } .crl.g-asi { fill: url(#hx-asi); }
.subs, .sub-base { display: none; }
.subs.on, .sub-base.on { display: inline; }
/* Sınır hiyerarşisi
   ülke sınırı  : düz koyu çizgi
   il/eyalet    : aynı koyu kılıfın üstünde beyaz çekirdek */
.sbase { stroke: var(--border); stroke-width: 1.8; stroke-linejoin: round;
         vector-effect: non-scaling-stroke; pointer-events: none; }
.sub { stroke: none; }
.inner { fill: none; stroke: var(--sub-line); stroke-width: 1; stroke-linejoin: round;
         vector-effect: non-scaling-stroke; pointer-events: none; }
.inner-g { display: none; }
.inner-g.on { display: inline; }
/* küçük ülkelerin görünmez dokunma hedefi (Singapur, Malta, Bahreyn…) */
.hitdot { fill: transparent; pointer-events: all; }
.subs.on ~ .hits { pointer-events: none; }   /* bölge kipinde bölgeler öncelikli */
.is-filtering .cty:not(.hit):not(.hit2), .is-filtering .dot:not(.hit):not(.hit2),
.is-filtering .sub:not(.hit):not(.hit2) { fill: var(--land-mute); }
.is-filtering .cty.hit2, .is-filtering .dot.hit2, .is-filtering .sub.hit2 {
  stroke: var(--c-min, var(--ink-2)); stroke-width: 1.2;
}
.cty.sel, .dot.sel, .sub.sel { stroke: var(--ink); stroke-width: 2.6; }
.pin { fill: none; stroke: var(--ink); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.map-label {
  fill: var(--ink); paint-order: stroke; stroke: var(--ocean); stroke-width: 3.4;
  stroke-linejoin: round; font-weight: 650; letter-spacing: .01em;
  vector-effect: non-scaling-stroke;
}

/* ============================================================ üst çubuk = */
.top {
  position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 10px);
  border-radius: 20px; padding: 9px 14px; display: flex; align-items: center; gap: 10px;
  z-index: 5;
}
.top h1 { font-size: .9375rem; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.top p { margin: 0; font-size: .75rem; color: var(--ink-3); line-height: 1.25; }
.top .grow { min-width: 0; flex: 1; }
.top h1, .top p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .x {
  flex: none; width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center;
  background: var(--rule); font-size: .9rem; color: var(--ink-2);
}

/* ============================================================ araçlar === */
.tools {
  position: fixed; right: 12px; z-index: 5; display: grid; gap: 1px;
  border-radius: 18px; overflow: hidden; padding: 1px;
  transition: bottom .34s cubic-bezier(.22,.9,.24,1), opacity .2s ease, transform .2s ease;
  transform-origin: 100% 100%;
}
/* Panel yukarı çıkıp haritayı kapatınca araçlar çekilir — üst çubuğun altına
   sıkışıp kırpılmaktansa (Apple Maps de panel açılınca denetimleri gizler). */
.tools.away { opacity: 0; transform: scale(.86); pointer-events: none; }
.tools button {
  width: 46px; height: 44px; display: grid; place-items: center;
  font-size: 1.15rem; font-weight: 500; color: var(--ink);
}
.tools button:active { background: var(--rule); }
.tools button[aria-pressed="true"] { background: var(--tint); color: #fff; }
.tools .lbl { font-size: .625rem; letter-spacing: .04em; text-transform: uppercase; }

/* katman menüsü */
/* Menü de opak: altındaki harita bulanıklaşınca renkler birbirine karışıp
   metnin okunurluğunu düşürüyordu. Cam yalnızca üst çubukta ve araç sütununda. */
.pop {
  background: var(--sheet);
  border: .5px solid var(--edge);
  box-shadow: 0 10px 34px var(--shade);
  position: fixed; right: 12px; z-index: 6; width: min(300px, calc(100vw - 24px));
  border-radius: 18px; padding: 12px 13px 13px; display: grid; gap: 8px;
  overflow-y: auto; overscroll-behavior: contain;
}
.pop[hidden] { display: none; }
.pop-t { margin: 0; font-size: .75rem; font-weight: 600; letter-spacing: .03em;
  text-transform: uppercase; color: var(--ink-3); }
.pop-n { margin: 2px 0 0; font-size: .75rem; color: var(--ink-3); line-height: 1.35; }

/* ============================================================ sayfa ===== */
/* Panel haritanın üstünde yüzerken cam, yukarı çekilince opak.
   Pahalı olan durum "geniş bulanık alan + hareket eden harita"ydı; panel
   büyüdüğünde camı bırakınca o durum hiç oluşmuyor. Değişim de harita
   sürüklenirken değil, paneli sen çekerken ve onun animasyonuyla birlikte
   oluyor — 0.2.0 öncesindeki ani opaklık sıçramasının sebebi buydu. */
.sheet {
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(135%);
  backdrop-filter: blur(20px) saturate(135%);
  border: .5px solid var(--edge); border-bottom: 0;
  box-shadow: 0 -6px 30px var(--shade);
  transition: transform .34s cubic-bezier(.22,.9,.24,1),
              background .34s ease, -webkit-backdrop-filter .34s ease,
              backdrop-filter .34s ease;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  height: 92vh; border-radius: 22px 22px 0 0; padding: 0;
  display: flex; flex-direction: column;
  transform: translate3d(0, calc(100% - var(--peek, 128px)), 0);
}
.sheet.up {
  background: var(--sheet);
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
.sheet.dragging { transition: none; }
/* Tutamak: çizgi ince görünür ama dokunma alanı iOS ölçüsünde (44px). */
.grab {
  padding: 14px 0 10px; display: grid; place-items: center; flex: none;
  touch-action: none; min-height: 44px;
}
.grab i {
  display: block; width: 44px; height: 6px; border-radius: 3px;
  background: var(--ink-3); opacity: .42; transition: opacity .2s ease, width .2s ease;
}
.sheet.dragging .grab i, .grab:active i { opacity: .7; width: 52px; }
.sheet-head {
  flex: none; padding: 0 14px 11px; display: grid; gap: 9px; touch-action: none;
  border-bottom: .5px solid transparent; transition: border-color .2s ease;
}
.sheet-head.stuck { border-bottom-color: var(--rule); }
.searchbar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
  border-radius: 12px; background: var(--rule); }
.searchbar input {
  flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit;
  font-size: 1rem; outline: none; padding: 0;
}
.searchbar .ic { color: var(--ink-3); font-size: .95rem; flex: none; }
.searchbar button { color: var(--ink-3); padding: 4px; font-size: .9rem; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain; padding: 0 14px calc(env(safe-area-inset-bottom) + 20px); }

/* iOS tarzı bölümlü denetim */
.seg { display: flex; background: var(--rule); border-radius: 10px; padding: 2px; }
.seg button {
  flex: 1; padding: 7px 4px; border-radius: 8px; font-size: .8125rem; font-weight: 500;
  color: var(--ink-2); white-space: nowrap;
}
.seg button[aria-pressed="true"] {
  background: var(--glass-2); color: var(--ink);
  box-shadow: 0 1px 3px var(--shade), inset 0 .5px 0 rgba(255,255,255,.4);
}

/* ============================================================ listeler == */
.sec { margin-top: 16px; }
.sec-h {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  margin-bottom: 8px;
}
.sec-h h2 { font-size: 1.0625rem; font-weight: 650; margin: 0; letter-spacing: -.01em; }
.sec-h span { font-size: .8125rem; color: var(--ink-3); }
.rows { border-radius: 14px; overflow: hidden; background: var(--rule); }
.row {
  width: 100%; display: grid; grid-template-columns: 12px minmax(0,1fr) auto;
  gap: 11px; align-items: center; padding: 11px 13px; text-align: left;
  border-bottom: .5px solid var(--rule);
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--rule); }
.row[aria-pressed="true"] { background: var(--tint); color: #fff; }
.row[aria-pressed="true"] .sub-t, .row[aria-pressed="true"] .val { color: rgba(255,255,255,.82); }
.dot-c { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }
.dot-c.oth { background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 3px); }
.row-t { font-size: .9375rem; line-height: 1.25; }
.sub-t { font-size: .8125rem; color: var(--ink-3); }
.val { font-size: .8125rem; color: var(--ink-3); white-space: nowrap; }
.empty { padding: 22px 4px; color: var(--ink-3); font-size: .9375rem; text-align: center; }

/* ============================================================ detay ===== */
.d-top { display: flex; align-items: flex-start; gap: 12px; }
.d-top h2 { margin: 0; font-size: 1.375rem; font-weight: 680; letter-spacing: -.02em; }
.d-top p { margin: 2px 0 0; font-size: .875rem; color: var(--ink-3); }
.d-lang { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-size: 1.0625rem; font-weight: 600; }
.d-lang i { width: 13px; height: 13px; border-radius: 3px; background: var(--c); flex: none; }
.d-lang i.oth { background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 3px); }
.d-fam { margin: 2px 0 0; font-size: .8125rem; color: var(--ink-3); }
.stat { display: flex; gap: 10px; margin-top: 14px; }
.stat div { flex: 1; background: var(--rule); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.25rem; font-weight: 650; letter-spacing: -.02em; }
.stat span { font-size: .75rem; color: var(--ink-3); }
.bars { display: grid; gap: 9px; margin-top: 4px; }
.bar { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; }
.bar-n { font-size: .9375rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-v { font-size: .8125rem; color: var(--ink-3); white-space: nowrap; }
.bar-t { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.bar-t i { display: block; height: 100%; background: var(--c); border-radius: 4px; }
.note { margin: 10px 0 0; font-size: .8125rem; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 11px;
  border-radius: 11px; background: var(--rule); font-size: .8125rem;
}
.chip b { font-weight: 550; color: var(--ink-3); }
.acts { display: grid; gap: 8px; margin-top: 16px; }
.acts button {
  padding: 12px; border-radius: 13px; background: var(--tint); color: #fff;
  font-size: .9375rem; font-weight: 550; text-align: center;
}
.acts button.ghost { background: var(--rule); color: var(--ink); }

/* ölçek */
.scale { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.scale i { flex: 1; height: 10px; }
.scale i:first-of-type { border-radius: 4px 0 0 4px; }
.scale i:last-of-type { border-radius: 0 4px 4px 0; }
.scale span { font-size: .6875rem; color: var(--ink-3); }

/* ipucu */
.tip {
  position: fixed; z-index: 6; pointer-events: none; padding: 7px 11px; border-radius: 12px;
  font-size: .8125rem; opacity: 0; transition: opacity .15s; max-width: 62vw;
}
.tip.on { opacity: 1; }
.tip b { display: block; font-weight: 600; }
.tip span { color: var(--ink-3); font-size: .75rem; }

/* ---------------------------------------------------------- animasyon */
@media (prefers-reduced-motion: no-preference) {
  /* renk ölçütü değişince ülkeler yumuşak geçsin (hareket sırasında kapalı) */
  body:not(.busy) .cty, body:not(.busy) .sub, body:not(.busy) .dot, body:not(.busy) .sbase {
    transition: fill .32s ease, fill-opacity .32s ease;
  }
  .cty.sel, .dot.sel, .sub.sel { animation: sel .45s cubic-bezier(.3,1.4,.5,1); }
  @keyframes sel { from { stroke-width: 7; } to { stroke-width: 2; } }

  .map-label, .pin { animation: fade .3s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .pop:not([hidden]) { animation: pop .22s cubic-bezier(.2,1.1,.3,1) both; transform-origin: 88% 100%; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.94); } }

  /* kart bölümleri sırayla belirsin */
  .sheet-body > .sec, .sheet-body > .d-top, .sheet-body > .stat, .sheet-body > .acts {
    animation: up .32s cubic-bezier(.22,.9,.24,1) both;
  }
  .sheet-body > *:nth-child(2) { animation-delay: .03s; }
  .sheet-body > *:nth-child(3) { animation-delay: .06s; }
  .sheet-body > *:nth-child(4) { animation-delay: .09s; }
  .sheet-body > *:nth-child(5) { animation-delay: .12s; }
  @keyframes up { from { opacity: 0; transform: translateY(9px); } }

  .bar-t i { animation: grow .5s cubic-bezier(.22,.9,.24,1) both; transform-origin: left; }
  @keyframes grow { from { transform: scaleX(0); } }

  .row:active, .tools button:active, .chip:active { transform: scale(.97); }
  .row, .tools button, .chip { transition: transform .12s ease, background-color .15s ease; }
  .seg button { transition: background-color .18s ease, color .18s ease, box-shadow .18s ease; }
}
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>

<div id="stage"><svg id="map" role="img" aria-label="Dünya dil haritası"></svg></div>

<div class="top glass">
  <div class="grow">
    <h1 id="capT">Dünya dilleri</h1>
    <p id="capS">234 ülke · çoğunluğun konuştuğu dil</p>
  </div>
  <button class="x" id="btnClear" hidden aria-label="Süzgeci kaldır">✕</button>
</div>

<div class="tools glass" id="tools">
  <button id="btnLayers" aria-label="Görünüm ve ayrıntı" aria-pressed="false">◧</button>
  <button id="btnIn" aria-label="Yakınlaş">+</button>
  <button id="btnOut" aria-label="Uzaklaş">−</button>
  <button id="btnFit" aria-label="En geniş görünüm">⤢</button>
</div>

<div class="pop" id="pop" hidden>
  <p class="pop-t">Renk ölçütü</p>
  <div class="seg" role="group" aria-label="Renk ölçütü">

      put("wave", 960, H + 22, 1.48), put("ship", 1130, H + 28, 1.40, "bob"),
      put("serpent", 1310, H + 30, 1.48, "bob2"),
    ].join("");
    return `<defs>${defs}</defs><g class="orn" aria-hidden="true">${items}` +
      `<text class="orn-t" x="700" y="${H + 74}" text-anchor="middle">HIC SVNT DRACONES</text>` +
      `<text class="orn-t" x="430" y="-72" text-anchor="middle">MARE INCOGNITVM</text></g>`;
  }

  /* ------------------------------------------------------------ harita */
  const svg = $("#map"), stage = $("#stage");
  const W = D.w, H = D.h, DOT_AT = 2.2, HIT_AT = 26;
  const order = ids.slice().sort((a, b) => C[b].a - C[a].a);
  svg.innerHTML =
    `<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
       <rect width="7" height="7" fill="var(--g-oth)"></rect>
       <line x1="0" y1="0" x2="0" y2="7" stroke="var(--hatch)" stroke-width="1.6"></line>
     </pattern>` +
     GORDER.filter((g) => g !== "oth").map((g) =>
       `<pattern id="hx-${g}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="var(--g-${g})"></rect>
          <line x1="0" y1="0" x2="0" y2="6" stroke="var(--hatch)" stroke-width="1.5"></line>
        </pattern>`).join("") + `</defs>` +
    ornaments() +
    `<path class="sphere" d="${D.frame}"></path>` +
    `<g class="graticule"><path d="${D.grat}"></path></g>` +
    `<g class="lands">` + order.map((id) =>
      `<path class="cty ${gcls(LG[C[id].l])}" data-id="${id}" d="${C[id].d}"></path>`).join("") + `</g>` +
    `<g class="sub-base">` + Object.keys(subsOf).map((cid) =>
      `<path class="sbase ${gcls(LG[C[cid].l])}" data-id="${cid}" d="${
        subsOf[cid].map((s) => SB[s].d).join("")}"></path>`).join("") + `</g>` +
    `<g class="subs">` + subIds.map((sid) =>
      `<path class="sub ${gcls(LG[SB[sid].l])}" data-sid="${sid}" d="${SB[sid].d}"></path>`).join("") + `</g>` +
    `<g class="dots">` + order.filter((id) => C[id].a < DOT_AT).map((id) =>
      `<circle class="dot ${gcls(LG[C[id].l])}" data-id="${id}" cx="${C[id].c[0]}" cy="${C[id].c[1]}" r="3"></circle>`).join("") + `</g>` +
    `<g class="inner-g">` + Object.keys(D.inner || {}).map((cid) =>
      `<path class="inner" d="${D.inner[cid]}"></path>`).join("") + `</g>` +
    `<g class="hits">` + order.filter((id) => C[id].a < HIT_AT).map((id) =>
      `<circle class="hitdot" data-id="${id}" cx="${C[id].c[0]}" cy="${C[id].c[1]}" r="11"></circle>`).join("") + `</g>` +
    `<g class="marks"></g>`;
  const marks = svg.querySelector(".marks"), subG = svg.querySelector(".subs"),
        baseG = svg.querySelector(".sub-base"), innerG = svg.querySelector(".inner-g");
  const nodesOf = (id) => svg.querySelectorAll(`[data-id="${id}"]`);
  const subNode = (sid) => subG.querySelector(`[data-sid="${CSS.escape(sid)}"]`);

  // Görüş kutusu ekranın oranını izler: dünya görünümünde harita genişliğe
  // oturur, artan yer okyanus olur. Telefonun dik oranında doğru davranış bu.
  let vb = { x: 0, y: 0, w: W, h: W };
  const aspect = () => stage.clientHeight / Math.max(1, stage.clientWidth);
  const maxW = () => Math.min(W, (H + 2 * PAD) / aspect());
  // 160x: Singapur, Malta, Lüksemburg ve il merkezleri rahat seçilebilsin
  const clampW = (w) => Math.min(maxW(), Math.max(W / 160, w));

  let raf = 0, busy = false;
  // Not: bir ara jest boyunca viewBox'ı dondurup katmanı CSS dönüşümüyle
  // kaydırmayı denedim. Hızlıydı ama yanlıştı: compositor yalnızca zaten
  // çizilmiş pikselleri taşıyabildiği için kaydırırken kenarda boş alan
  // kalıyordu. Her kare gerçek viewBox yazılıyor; rAF ile kareye bir kez.
  function clampVB() {
    vb.w = clampW(vb.w);
    vb.h = vb.w * aspect();
    vb.x = vb.w >= W ? (W - vb.w) / 2 : Math.min(W - vb.w, Math.max(0, vb.x));
    vb.y = vb.h >= H + 2 * PAD ? (H - vb.h) / 2
                               : Math.min(H + PAD - vb.h, Math.max(-PAD, vb.y));
  }
  function applyVB() {                      // kareye bir kez uygula
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; commitVB(); });
  }
  function commitVB() {
    clampVB();
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    if (!busy) refineMarks();               // parmak üzerindeyken atlanır
    document.body.classList.toggle("zoomed", vb.w < maxW() * .62);
    applyLod();
  }
  // Bir CSS pikselinin kaç harita birimi ettiği. İşaretleri buna göre
  // ölçekleyince yakınlaşmadan ve ekran genişliğinden bağımsız sabit kalırlar.
  // Ölçüyü #map'ten değil #stage'ten alıyoruz: jest sırasında #map'e CSS
  // dönüşümü uyguluyoruz ve getBoundingClientRect onu da hesaba katardı.
  let rectCache = null;
  const mapRect = () => rectCache || (rectCache = stage.getBoundingClientRect());
  const unit = () => vb.w / Math.max(1, mapRect().width);
  addEventListener("resize", () => { rectCache = null; });
  addEventListener("scroll", () => { rectCache = null; }, true);
  let dotNodes = null, hitNodes = null;
  function refineMarks() {
    const u = unit();
    if (!dotNodes) dotNodes = svg.querySelectorAll(".dot");
    dotNodes.forEach((d) => d.setAttribute("r", (3 * u).toFixed(2)));
    if (!hitNodes) hitNodes = svg.querySelectorAll(".hitdot");
    hitNodes.forEach((d) => d.setAttribute("r", (11 * u).toFixed(2)));
    marks.querySelectorAll(".pin").forEach((p) => p.setAttribute("r", (8 * u).toFixed(2)));
    const lbl = marks.querySelector(".map-label");
    if (lbl) lbl.setAttribute("font-size", (14 * u).toFixed(2));
  }
  // Cam bulanıklığı ve ince ayarlar hareket sırasında kapanır: telefonda
  // her karede yeniden bulanıklaştırmak en pahalı iş.
  function setBusy(on) {
    if (busy === on) return;
    busy = on;
    document.body.classList.toggle("busy", on);
    if (!on) { refineMarks(); applyVB(); }
  }
  const svgPt = (cx, cy) => {
    const r = mapRect();
    return { x: vb.x + (cx - r.left) * vb.w / r.width, y: vb.y + (cy - r.top) * vb.h / r.height };
  };
  function zoomAt(k, p) {
    const nw = clampW(vb.w * k), r = nw / vb.w;
    vb.x = p.x - (p.x - vb.x) * r; vb.y = p.y - (p.y - vb.y) * r; vb.w = nw; applyVB();
  }
  // Görünür bant: üstte cam çubuk, altta panel. Seçilen yer ikisinin de
  // altında kalmasın diye kutuyu bu bandın ortasına oturtuyoruz.
  const TOPBAR = 86;
  function zoomTo(cx, cy, w) {
    vb.w = clampW(w); vb.h = vb.w * aspect();
    vb.x = cx - vb.w / 2;
    const st = stage.clientHeight || 1;
    const bot = sheetTop || st;
    vb.y = cy - vb.h * ((TOPBAR + bot) / 2 / st);
    applyVB();
  }
  $("#btnIn").onclick = () => zoomAt(1 / 1.7, { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
  $("#btnOut").onclick = () => zoomAt(1.7, { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 });
  $("#btnFit").onclick = () => homeView();
  // En geniş görünüm: harita ekranı tam kaplar, Avrupa–Akdeniz ortada.
  function homeView() {
    vb.w = maxW(); vb.h = vb.w * aspect();
    vb.x = 700 - vb.w / 2; vb.y = 200 - vb.h / 2;
    applyVB();
  }

  /* --------------------------------------------------- dokunma / gezinme */
  const pts = new Map();
  let drag = null, pinch = null;
  const spread = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const midC = () => { const [a, b] = [...pts.values()];
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  svg.addEventListener("pointerdown", (e) => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      drag = null; rectCache = null;
      const c = midC();
      // jest boyunca sabit kalacak harita noktası — parmakların altındaki yer
      pinch = { d: spread(), w: vb.w, p: svgPt(c.x, c.y) };
      return;
    }
    if (pts.size > 2) return;
    const t = e.target.closest("[data-id]"), ts = subOn ? e.target.closest("[data-sid]") : null;
    drag = { sx: e.clientX, sy: e.clientY, vx: vb.x, vy: vb.y, moved: false,
             id: t ? t.dataset.id : null, sid: ts ? ts.dataset.sid : null };
    rectCache = null;
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", (e) => {
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size === 2) {
      const d = spread();
      if (d > 4) {
        setBusy(true);
        const r = mapRect(), c = midC();
        vb.w = clampW(pinch.w * pinch.d / d);
        vb.h = vb.w * aspect();
        // pinch.p, parmakların şu anki orta noktasının altında kalsın:
        // hem sıçrama olmuyor hem iki parmakla kaydırma da çalışıyor
        vb.x = pinch.p.x - ((c.x - r.left) / r.width) * vb.w;
        vb.y = pinch.p.y - ((c.y - r.top) / r.height) * vb.h;
        applyVB();
      }
      return;
    }
    if (!drag) { hover(e); return; }
    const r = svg.getBoundingClientRect(), sc = vb.w / r.width;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) {
      drag.moved = true; tip.classList.remove("on"); setBusy(true);
    }
    vb.x = drag.vx - dx * sc; vb.y = drag.vy - dy * sc; applyVB();
  });
  const endPtr = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0) setBusy(false);
    if (drag && !drag.moved && !e.__cancel) {
      let { id, sid } = drag;
      // Parmak ucu bir noktadan geniştir: tam isabet yoksa çevrede ara.
      // Singapur, Malta, Bahreyn gibi yerler böyle seçilebiliyor.
      if (!id && !sid) {
        const hit = nearHit(e.clientX, e.clientY);
        if (hit) { id = hit.id; sid = hit.sid; }
      }
      if (sid) select(SB[sid].p, sid);
      else if (id) select(id);
      else select(null);
    }
    drag = null;
  };
  // dokunulan noktanın çevresini halka halka tarayarak en yakın alanı bul
  const RINGS = [0, 10, 18, 26];
  function nearHit(cx, cy) {
    for (const r of RINGS) {
      const steps = r === 0 ? 1 : 8;
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * 2 * Math.PI;
        const el = document.elementFromPoint(cx + r * Math.cos(a), cy + r * Math.sin(a));
        if (!el || !el.closest) continue;
        const ts = subOn ? el.closest("[data-sid]") : null;
        if (ts) return { sid: ts.dataset.sid, id: null };
        const t = el.closest("[data-id]");
        if (t) return { id: t.dataset.id, sid: null };
      }
    }
    return null;
  }
  svg.addEventListener("pointerup", endPtr);
  svg.addEventListener("pointercancel", (e) => { e.__cancel = true; endPtr(e); });
  svg.addEventListener("wheel", (e) => {                       // masaüstü tarayıcı için
    e.preventDefault();
    if (e.ctrlKey) { zoomAt(Math.exp(e.deltaY * 0.01), svgPt(e.clientX, e.clientY)); return; }
    const sc = vb.w / svg.getBoundingClientRect().width;
    vb.x += e.deltaX * sc; vb.y += e.deltaY * sc; applyVB();
  }, { passive: false });

  /* ------------------------------------------------------------- ipucu */
  const tip = $("#tip");
  function hover(e) {
    if (matchMedia("(pointer: coarse)").matches) return;   // dokunmatikte ipucu yok
    const ts = subOn ? e.target.closest("[data-sid]") : null;
    const o = ts ? SB[ts.dataset.sid] : null;
    const t = o ? null : e.target.closest("[data-id]");
    if (!o && !t) { tip.classList.remove("on"); return; }
    const c = o || C[t.dataset.id], l = LG[c.l];
    tip.innerHTML = `<b>${esc(o ? sn(c) : cn(c))}</b><span>${esc(l ? ln(l) : "")} · ${pc(o ? c.mix[0][1] : c.p)}</span>`;
    tip.style.left = Math.min(innerWidth - 12, Math.max(12, e.clientX)) + "px";
    tip.style.top = Math.max(70, e.clientY - 54) + "px";
    tip.classList.add("on");
  }

  /* ------------------------------------------------- ayrıntı düzeyi (LOD) */
  let subOn = false;
  // Otomatik geçişin ölçütü ekranın kesri değil, bir harita biriminin kaç piksel
  // ettiği. Böylece bölgeler telefonda da masaüstünde de aynı *görünür* ölçekte
  // açılıyor. Eski eşik W'nin kesri olarak yazılmıştı (W/1.5); telefonda en
  // geniş görünüm zaten W'nin çok altında kaldığı için bölgeler hiç kapanmıyor,
  // masaüstünde ise 1,5x gibi erken bir yakınlıkta açılıyordu.
  // 2.5 px/birim ≈ Türkiye ekranda ~170 piksel: iller okunur ama harita hâlâ
  // bölgesel. Eski masaüstü eşiği 1,5x (0,78 px/birim) idi, iki katından
  // fazla geç açılıyor artık. Elle "Bölge" seçimi bunu her zaman ezer.
  const LOD_ON = 2.5, LOD_OFF = 2.0;      // piksel / harita birimi (histerezis)
  const mapScale = () => mapRect().width / vb.w;
  function applyLod() {
    const k = mapScale();
    const want = state.lod === "on" ? true : state.lod === "off" ? false
      : (subOn ? k > LOD_OFF : k > LOD_ON);
    if (want !== subOn) setSubs(want);
  }
  function setSubs(on) {
    subOn = on;
    subG.classList.toggle("on", on);
    baseG.classList.toggle("on", on);
    innerG.classList.toggle("on", on);
    if (on) { markMap(); repaint(); }
    if (!on && state.selSub) select(state.sel);
  }

  /* ---------------------------------------------------------- boyama */
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function rgb(s) {
    if (s.startsWith("#")) {
      return s.length === 4 ? s.slice(1).split("").map((c) => parseInt(c + c, 16))
                            : [1, 3, 5].map((i) => parseInt(s.substr(i, 2), 16));
    }
    const m = s.match(/[\d.]+/g) || [128, 128, 128];
    return [+m[0], +m[1], +m[2]];
  }
  const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const PCT_BINS = [5, 15, 35, 60, 85], PPL_BINS = [10, 100, 1000, 10000, 100000];
  const STOPS = [0.2, 0.34, 0.5, 0.67, 0.84, 1];
  let ramp = [], rampKey = "";
  function buildRamp(hue) {
    const base = rgb(css("--land-mute")), top = rgb(css(hue)), ink = rgb(css("--ink"));
    ramp = STOPS.map((t, i) => {
      const c = mixc(base, top, t);
      const f = i === STOPS.length - 1 ? mixc(c, ink, 0.22) : c;
      return `rgb(${f[0]} ${f[1]} ${f[2]})`;
    });
  }
  const binOf = (v, bins) => { let i = 0; while (i < bins.length && v >= bins[i]) i++; return i; };
  function share(o) {
    const f = state.filter;
    if (f && f.t === "l") {
      const row = (o.mix || []).find(([n]) => n === LG[f.k].n);
      if (row) return row[1];
      return o.l === f.k ? (o.p !== undefined ? o.p : o.mix[0][1]) : null;
    }
    if (f && f.t === "g") return LG[o.l] && LG[o.l].g === f.k ? (o.p !== undefined ? o.p : o.mix[0][1]) : null;
    return o.p !== undefined ? o.p : (o.mix ? o.mix[0][1] : null);
  }
  function paintNode(n, o) {
    if (state.paint === "fam" || !o) { n.style.fill = ""; return; }
    const v = share(o);
    if (v == null) { n.style.fill = "var(--land-mute)"; return; }
    n.style.fill = ramp[state.paint === "pct" ? binOf(v, PCT_BINS)
      : binOf(o.pop ? o.pop * v / 100 : 0, PPL_BINS)];
  }
  function repaint() {
    const f = state.filter;
    const hue = f && f.t === "l" ? `--g-${LG[f.k].g}` : (f && f.t === "g" ? `--g-${f.k}` : "--g-ger");
    const key = state.paint + "|" + hue;
    if (key !== rampKey) { buildRamp(hue); rampKey = key; }
    if (state.paint !== "fam") {
      svg.querySelectorAll(".cty, .dot").forEach((n) => paintNode(n, C[n.dataset.id]));
      svg.querySelectorAll(".sub").forEach((n) => paintNode(n, SB[n.dataset.sid]));
      svg.querySelectorAll(".sbase").forEach((n) => paintNode(n, C[n.dataset.id]));
    } else {
      svg.querySelectorAll(".cty, .dot, .sub, .sbase").forEach((n) => {
        n.style.fill = ""; n.style.fillOpacity = "";
      });
      styleMinor();
    }
  }

  /* ---------------------------------------------------------- vurgular */
  let lastMinor = [];
  function styleMinor() {
    const f = state.filter, mg = f && f.t === "l" ? LG[f.k].g : null;
    lastMinor.forEach(([i]) => nodesOf(i).forEach((n) => {
      if (state.paint !== "fam") { n.style.fill = ""; n.style.fillOpacity = ""; return; }
      n.style.fill = mg === "oth" ? "url(#hatch)" : `var(--g-${mg})`;
      n.style.fillOpacity = mg === "oth" ? ".4" : ".45";
    }));
  }
  function markMap() {
    const f = state.filter;
    svg.querySelectorAll(".hit, .hit2").forEach((n) => {
      n.classList.remove("hit", "hit2"); n.style.fill = ""; n.style.fillOpacity = "";
    });
    svg.classList.toggle("is-filtering", !!f);
    lastMinor = [];
    if (!f) return [];
    ids.filter((i) => f.t === "l" ? C[i].l === f.k : LG[C[i].l].g === f.k)
      .forEach((i) => nodesOf(i).forEach((n) => n.classList.add("hit")));
    subIds.forEach((sid) => {
      const s = SB[sid], n = subNode(sid);
      if (!n) return;
      const main = f.t === "l" ? s.l === f.k : (LG[s.l] && LG[s.l].g === f.k);
      if (main) n.classList.add("hit");
      else if (f.t === "l" && (s.mix || []).some(([nm]) => nm === LG[f.k].n)) n.classList.add("hit2");
    });
    const minor = f.t === "l" ? (LG[f.k].in || []).filter(([i]) => C[i].l !== f.k) : [];
    const mg = f.t === "l" ? LG[f.k].g : null;
    svg.style.setProperty("--c-min", mg && mg !== "oth" ? `var(--g-${mg})` : "var(--ink-2)");
    minor.forEach(([i]) => nodesOf(i).forEach((n) => n.classList.add("hit2")));
    lastMinor = minor;
    styleMinor();
    return minor;
  }

  /* ------------------------------------------------------------- sayfa */
  const sheet = $("#sheet"), body = $("#body"), grab = $("#grab"), head = $("#head");
  const PEEK = 128;
  let detent = "peek", sheetTop = 0;         // peek | half | full
  const heights = () => {
    const h = sheet.offsetHeight;
    return { peek: h - PEEK, half: h * 0.42, full: 0 };   // translateY değerleri
  };
  const sheetY = () => heights()[detent];
  // Yüzen katmanların yerleşimi tek elden. Araç sütunu panelin üstünde durur
  // ama üst çubuğun altına girmez; menü de araç sütununun üstünde açılır ve
  // ekranın dışına taşmaz. Eskiden ikisi de panele bakıp körlemesine
  // konumlanıyordu, panel yukarıdayken tepeden kırpılıyorlardı.
  const tools = $("#tools");
  const GAP = 12;
  function placeFloaters(top) {
    const st = stage.clientHeight || 1;
    const th = tools.offsetHeight || 183;
    const roof = st - (TOPBAR + 8) - th;             // daha yukarı çıkamaz
    const away = roof < GAP;                          // hiç yer yok
    const bottom = Math.min(Math.max(GAP, st - top + GAP), Math.max(GAP, roof));
    tools.style.bottom = bottom + "px";
    tools.classList.toggle("away", away);
    if (!pop.hidden) {
      const pb = st - (st - bottom - th) + 10;        // araç sütununun üstü
      pop.style.bottom = pb + "px";
      pop.style.maxHeight = Math.max(160, st - pb - (TOPBAR + 8)) + "px";
    }
  }
  function setDetent(d, quiet, keepPop) {
    if (!keepPop && !pop.hidden) setPop(false);   // menü panelle sürüklenmesin
    detent = d;
    sheet.classList.toggle("up", d !== "peek");
    const y = heights()[d];
    sheet.style.transform = `translate3d(0, ${y}px, 0)`;
    sheetTop = sheet.offsetTop + y;                  // araç sütunu ve harita için
    placeFloaters(sheetTop);
    if (!quiet) live(d === "peek" ? t().panelShut : t().panelOpen);
  }
  // sürükleme
  let sd = null;
  const startDrag = (e) => {
    if (e.target.closest("input, button")) return;
    if (!pop.hidden) setPop(false);
    sd = { y: e.clientY, base: heights()[detent], t: Date.now() };
    sheet.classList.add("dragging");
    tools.style.transition = "none";     // parmakla birlikte anında kaysın
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const moveDrag = (e) => {
    if (!sd) return;
    const y = Math.max(0, Math.min(heights().peek, sd.base + (e.clientY - sd.y)));
    sheet.style.transform = `translate3d(0, ${y}px, 0)`;
    placeFloaters(sheet.offsetTop + y);
    sd.last = y;
  };
  const endDrag = (e) => {
    if (!sd) return;
    sheet.classList.remove("dragging");
    tools.style.transition = "";
    const h = heights(), y = sd.last === undefined ? sd.base : sd.last;
    const v = (e.clientY - sd.y) / Math.max(1, Date.now() - sd.t);   // px/ms
    let d;
    if (v > 0.7) d = y > h.half ? "peek" : "half";
    else if (v < -0.7) d = y < h.half ? "full" : "half";
    else d = [["peek", h.peek], ["half", h.half], ["full", h.full]]
      .sort((a, b) => Math.abs(a[1] - y) - Math.abs(b[1] - y))[0][0];
    sd = null;
    setDetent(d);
  };
  [grab, head].forEach((el) => {
    el.addEventListener("pointerdown", startDrag);
    el.addEventListener("pointermove", moveDrag);
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
  });
  grab.addEventListener("click", () => setDetent(detent === "peek" ? "half" : "peek"));

  // İçerikten aşağı çekince de kapansın: liste en üstteyken aşağı yönlü hareket
  // paneli sürükler, aksi hâlde normal kaydırma olur (iOS davranışı). Dokunmatikte
  // tarayıcı kaydırmayı kendi devraldığı için pointer değil touch olayları
  // kullanılıyor; devralmayı preventDefault ile kesiyoruz.
  let take = null;
  body.addEventListener("scroll", () => {
    head.classList.toggle("stuck", body.scrollTop > 2);
  }, { passive: true });
  body.addEventListener("touchstart", (e) => {
    take = e.touches.length === 1 ? { y: e.touches[0].clientY, on: false } : null;
  }, { passive: true });
  body.addEventListener("touchmove", (e) => {
    if (!take || e.touches.length !== 1) return;
    const y = e.touches[0].clientY, dy = y - take.y;
    if (!take.on) {
      if (body.scrollTop > 0 || dy < 10) { if (dy < -6) take = null; return; }
      take.on = true;
      sd = { y: take.y, base: heights()[detent], t: Date.now() };
      sheet.classList.add("dragging");
    }
    e.preventDefault();
    moveDrag({ clientY: y });
  }, { passive: false });
  const bodyEnd = (e) => {
    if (take && take.on) {
      const t = e.changedTouches && e.changedTouches[0];
      endDrag({ clientY: t ? t.clientY : sd ? sd.y : 0 });
    }
    take = null;
  };
  body.addEventListener("touchend", bodyEnd, { passive: true });
  body.addEventListener("touchcancel", bodyEnd, { passive: true });

  /* -------------------------------------------------------- içerik */
  const total = (s) => LG[s].c + LG[s].t;
  const spk = (s) => LG[s].s;
  function matches(slug) {
    if (!state.q) return true;
    const q = norm(state.q), l = LG[slug];
    if (norm(l.n).includes(q) || norm(l.e).includes(q) || norm(l.f).includes(q)
        || norm(l.ne || "").includes(q)) return true;
    return (l.in || []).some(([i]) => norm(C[i].n).includes(q) || norm(C[i].en).includes(q));
  }
  let lastKey = "";
  function render() {
    // içerik değiştiyse panel başa sarsın; aynı içerik yenileniyorsa yerinde kalsın
    const key = (state.sel || "") + "|" + (state.selSub || "") + "|" + state.q;
    if (key !== lastKey) { body.scrollTop = 0; lastKey = key; }
    if (state.sel) { renderDetail(); return; }
    const q = norm(state.q);
    let html = "";
    if (state.q) {
      const cs = ids.filter((i) => norm(C[i].n).includes(q) || norm(C[i].en).includes(q))
        .sort((a, b) => trc(cn(C[a]), cn(C[b]))).slice(0, 8);
      if (cs.length) {
        html += `<div class="sec"><div class="sec-h"><h2>${t().countries}</h2></div><div class="rows">` +
          cs.map((i) => {
            const l = LG[C[i].l];
            return `<button class="row" data-go="${i}" style="--c:${col(l.g)}">
              <span class="dot-c ${l.g === "oth" ? "oth" : ""}"></span>
              <span><span class="row-t">${esc(cn(C[i]))}</span><br><span class="sub-t">${esc(ln(l))}</span></span>
              <span class="val num">${pc(C[i].p)}</span></button>`;
          }).join("") + `</div></div>`;
      }
    }
    const hits = langIds.filter(matches).sort((a, b) =>
      state.sort === "spk" ? spk(b) - spk(a) || trc(ln(LG[a]), ln(LG[b]))
                           : total(b) - total(a) || trc(ln(LG[a]), ln(LG[b])));
    html += `<div class="sec"><div class="sec-h"><h2>${t().languages}</h2>
        <span>${t().nLangs(hits.length)}</span></div>
      <div class="seg" role="group" aria-label="Sıralama" style="margin-bottom:8px">
        <button data-sort="spk" aria-pressed="${state.sort === "spk"}">${t().bySpk}</button>
        <button data-sort="cnt" aria-pressed="${state.sort === "cnt"}">${t().byCnt}</button>
      </div>`;
    html += hits.length ? `<div class="rows">` + hits.slice(0, 160).map((s) => {
      const l = LG[s], on = state.filter && state.filter.t === "l" && state.filter.k === s;
      return `<button class="row" data-l="${s}" aria-pressed="${on}" style="--c:${col(l.g)}">
        <span class="dot-c ${l.g === "oth" ? "oth" : ""}"></span>
        <span><span class="row-t">${esc(ln(l))}</span><br><span class="sub-t">${esc(l.e)}</span></span>
        <span class="val num">${state.sort === "spk" ? fmtK(l.s) : (total(s) ? t().cnt(total(s)) : "—")}</span>
      </button>`;
    }).join("") + `</div>` : `<p class="empty">${esc(t().noHit(state.q))}</p>`;
    html += `</div>`;
    body.innerHTML = html;
  }
  function scaleHTML() {
    if (state.paint === "fam") return "";
    const lab = state.paint === "pct" ? [t().scaleLo, t().scaleHi] : [t().scaleLoP, t().scaleHiP];
    return `<div class="scale"><span>${lab[0]}</span>` +
      ramp.map((c) => `<i style="background:${c}"></i>`).join("") + `<span>${lab[1]}</span></div>`;
  }

  const bars = (list, pop, hue, cap) => {
    const show = cap ? list.slice(0, cap) : list, rest = list.length - show.length;
    return `<div class="bars">` + show.map(([n, p]) =>
      `<div class="bar" style="--c:${hue}">
         <span class="bar-n">${esc(tx(n))}</span>
         <span class="bar-v num">${pc(p)}${pop ? " · " + fmtK(pop * p / 100) : ""}</span>
         <span class="bar-t"><i style="width:${Math.min(100, p)}%"></i></span>
       </div>`).join("") + `</div>` +
      (rest ? `<p class="note">${esc(t().more(rest))}</p>` : "");
  };

  function renderDetail() {
    const sub = state.selSub ? SB[state.selSub] : null;
    const id = state.sel;
    const c = sub
      ? { n: sn(sub), r: cn(C[sub.p]) + " · " + t().region, l: sub.l, p: sub.mix[0][1],
          pop: sub.pop, mix: sub.mix, l2: C[sub.p].l2, l2c: !!C[sub.p].l2, sub: true }
      : { n: cn(C[id]), r: (ui === "en" ? C[id].re : C[id].r) + (C[id].t ? " · " + t().dep : ""),
          l: C[id].l, p: C[id].p, pop: C[id].pop, mix: C[id].mix, l2: C[id].l2,
          note: noteOf(C[id]), m: C[id].m };
    const l = LG[c.l] || LG[C[id].l];
    const minor = LG[c.l] ? (LG[c.l].in || []).filter(([i]) => C[i].l !== c.l) : [];
    body.innerHTML =
      `<div class="d-top"><div class="grow" style="flex:1;min-width:0">
         <h2>${esc(c.n)}</h2><p>${esc(c.r)}</p></div></div>` +
      `<p class="d-lang" style="--c:${col(l.g)}"><i class="${l.g === "oth" ? "oth" : ""}"></i>${esc(ln(l))}</p>` +
      `<p class="d-fam">${esc(lf(l))}</p>` +
      `<div class="stat">
         <div><b class="num">${pc(c.p)}</b><span>${t().speaks}</span></div>
         <div><b class="num">${c.pop ? fmtK(c.pop * c.p / 100) : "—"}</b><span>${t().people}</span></div>
         <div><b class="num">${c.pop ? fmtK(c.pop) : "—"}</b><span>${t().pop}</span></div>
       </div>` +
      (c.m === 0 ? `<p class="note">${t().noMajority}</p>` : "") +
      (c.note ? `<p class="note">${esc(c.note)}</p>` : "") +
      (c.mix ? `<div class="sec"><div class="sec-h"><h2>${t().home}</h2></div>
         ${bars(c.mix, c.pop, col(l.g), 12)}
         <p class="note">${t().homeNote}</p></div>` : "") +
      (c.l2 ? `<div class="sec"><div class="sec-h"><h2>${t().l2}</h2></div>
         ${bars(c.l2, c.pop, "var(--ink-3)", 8)}
         <p class="note">${t().l2Note}${c.l2c ? t().l2Country(esc(cn(C[state.sel]))) : ""}</p></div>` : "") +
      (minor.length ? `<div class="sec"><div class="sec-h"><h2>${esc(t().elsewhere(ln(l)))}</h2>
           <span>${t().minor(minor.length)}</span></div>
         <div class="chips">` + minor.slice(0, 14).map((m) =>
           `<button class="chip" data-go="${m[0]}">${esc(cn(C[m[0]]))} <b class="num">${pc(m[1])}</b></button>`).join("") +
         `</div></div>` : "") +
      `<div class="acts">` +
        (sub ? `<button class="ghost" data-up="${id}">${esc(t().back(cn(C[id])))}</button>` : "") +
        (!sub && subsOf[id] ? `<button class="ghost" data-sub="${id}">${esc(t().showSubs(c.n))}</button>` : "") +
        `<button data-l="${c.l}">${esc(t().showLang(ln(l)))}</button>` +
        `<button class="ghost" data-close="1">${t().close}</button>` +
      `</div>`;
  }

  /* ------------------------------------------------------ katman menüsü */
  const pop = $("#pop");
  function setPop(on) {
    if (on) {
      // Menü yarım açılmaktansa panel aşağı insin: panel en alt durağa
      // kayarken menü kendi animasyonuyla, tam sığacağı yerde açılır.
      setDetent("peek", 1, true);
      pop.hidden = false;
      placeFloaters(sheetTop);
      syncPop();
    } else {
      pop.hidden = true;
    }
    $("#btnLayers").setAttribute("aria-pressed", String(on));
  }
  function syncPop() {
    const set = (sel, val) => pop.querySelectorAll(sel).forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset[Object.keys(b.dataset)[0]] === val)));
    set("[data-paint]", state.paint);
    set("[data-lod]", state.lod);
    set("[data-theme]", theme);
    set("[data-ui]", ui);
    $("#popScale").innerHTML = scaleHTML();
    // menü etiketleri de seçili dile göre
    const P = pop.querySelectorAll(".pop-t");
    P[0].textContent = t().paint; P[1].textContent = t().detail;
    P[2].textContent = t().theme;
    $("#popNote").textContent = t().lodNote;
    const lbl = [["[data-paint='fam']", t().pFam], ["[data-paint='pct']", t().pPct],
                 ["[data-paint='ppl']", t().pPpl], ["[data-lod='auto']", t().dAuto],
                 ["[data-lod='off']", t().dOff], ["[data-lod='on']", t().dOn],
                 ["[data-theme='auto']", t().tAuto], ["[data-theme='light']", t().tLight],
                 ["[data-theme='dark']", t().tDark]];
    lbl.forEach(([q, v]) => { const b = pop.querySelector(q); if (b) b.textContent = v; });
  }
  $("#btnLayers").onclick = () => setPop(pop.hidden);
  pop.addEventListener("click", (e) => {
    const b = e.target.closest("[data-paint],[data-lod],[data-theme],[data-ui]");
    if (!b) return;
    const d = b.dataset;
    if (d.paint) { state.paint = d.paint; rampKey = ""; repaint(); }
    else if (d.lod) { state.lod = d.lod; applyLod(); }
    else if (d.theme) { setTheme(d.theme); }
    else if (d.ui) { setUi(d.ui); }
    syncPop();
  });

  /* --------------------------------------------------------- tema ve dil */
  let theme = localStorage.getItem("wl-theme") || "auto";
  function setTheme(v) {
    theme = v;
    localStorage.setItem("wl-theme", v);
    if (v === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", v);
    rampKey = ""; repaint();
  }
  function setUi(v) {
    ui = v;
    localStorage.setItem("wl-ui", v);
    document.documentElement.lang = v;
    $("#q").placeholder = t().search;
    setFilter(state.filter);          // başlık ve liste yeniden yazılır
    render();
  }
  svg.addEventListener("pointerdown", () => { if (!pop.hidden) setPop(false); });

  /* ---------------------------------------------------------- eylemler */
  body.addEventListener("click", (e) => {
    const t = e.target.closest("[data-go],[data-l],[data-sort],[data-up],[data-sub],[data-close]");
    if (!t) return;
    const d = t.dataset;
    if (d.go) { setDetent("half", 1); select(d.go); focusCountry(d.go); return; }
    if (d.sort) { state.sort = d.sort; render(); return; }
    if (d.up) { setDetent("half", 1); select(d.up); focusCountry(d.up); return; }
    if (d.sub) { state.lod = "on"; applyLod(); focusCountry(d.sub); syncPop(); return; }
    if (d.close) { select(null); setDetent("peek"); return; }
    if (d.l) {
      const same = state.filter && state.filter.t === "l" && state.filter.k === d.l;
      setFilter(same ? null : { t: "l", k: d.l });
      if (!same) setDetent("peek");
    }
  });

  /* ------------------------------------------------------------ süzgeç */
  function setFilter(f) {
    state.filter = f;
    markMap();
    rampKey = ""; repaint();
    $("#btnClear").hidden = !f;
    if (!f) {
      $("#capT").textContent = t().title;
      $("#capS").textContent = t().sub(ids.length);
    } else if (f.t === "l") {
      const l = LG[f.k];
      $("#capT").textContent = ln(l);
      $("#capS").textContent = (l.c + l.t ? t().majIn(l.c + l.t) : t().majNone) +
        " · " + t().native(fmtK(l.s));
    }
    if (!state.sel) render();
    live(f ? $("#capT").textContent : t().filterOff);
  }
  $("#btnClear").onclick = () => { setFilter(null); select(null); };

  /* ------------------------------------------------------------- seçim */
  function select(id, sid) {
    state.sel = id || null; state.selSub = sid || null;
    svg.querySelectorAll(".sel").forEach((n) => n.classList.remove("sel"));
    marks.innerHTML = "";
    if (!id) { render(); return; }
    if (sid) { const n = subNode(sid); if (n) n.classList.add("sel"); }
    else nodesOf(id).forEach((n) => n.classList.add("sel"));
    const o = sid ? SB[sid] : C[id], u = unit();
    if ((o.a || 0) < 6) {
      marks.innerHTML = `<circle class="pin" cx="${o.c[0]}" cy="${o.c[1]}" r="${(8 * u).toFixed(2)}"></circle>`;
    }
    marks.insertAdjacentHTML("beforeend",
      `<text class="map-label" x="${o.c[0]}" y="${o.c[1] - 12 * u}" text-anchor="middle"
        font-size="${(14 * u).toFixed(2)}">${esc(sid ? sn(o) : cn(o))}</text>`);
    render();
    if (detent === "peek") setDetent("half");
  }
  function focusCountry(id) {
    const c = C[id];
    zoomTo(c.c[0], c.c[1], Math.max(W / 9, Math.min(W, Math.sqrt(Math.max(c.a, 6)) * 22)));
  }
  function live(t) { $("#live").textContent = t; }

  /* ------------------------------------------------------------- arama */
  const q = $("#q"), qClear = $("#qClear");
  q.addEventListener("input", () => {
    state.q = q.value.trim(); qClear.hidden = !state.q;
    if (state.sel) { state.sel = null; state.selSub = null; }
    render();
  });
  q.addEventListener("focus", () => { if (detent !== "full") setDetent("full"); });
  q.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault(); q.blur();
    const hit = ids.find((i) => state.q && norm(C[i].n).includes(norm(state.q)));
    if (hit) { select(hit); focusCountry(hit); setDetent("half"); }
  });
  qClear.onclick = () => { q.value = ""; state.q = ""; qClear.hidden = true; render(); q.focus(); };

  /* --------------------------------------------------------------- git */
  addEventListener("resize", () => { applyVB(); setDetent(detent, true); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    rampKey = ""; repaint(); render();
  });
  if (theme !== "auto") document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.lang = ui;
  $("#q").placeholder = t().search;
  $("#capT").textContent = t().title;
  $("#capS").textContent = t().sub(ids.length);
  buildRamp("--g-ger");
  render();
  setDetent("peek", true);
  homeView();
})();
</script>
</body></html>
